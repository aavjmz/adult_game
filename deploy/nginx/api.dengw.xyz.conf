# api.dengw.xyz - adult_game 客户端 API 反向代理
#
# 部署位置：/root/xray-deploy/nginx/conf.d/api.dengw.xyz.conf
# 本文件是该配置在版本库中的副本，修改后需同步到服务器（见 deploy/README.md）。
#
# 后端 adult_game 容器在 adult_game_default 网络上。承载本配置的 nginx 属于
# 另一个部署栈（xray-deploy），已额外接入该网络，因此可直接用容器名访问。

# WebSocket 升级：仅在客户端请求 Upgrade 时才透传 Connection: upgrade，
# 普通请求保持 keepalive。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP - Let's Encrypt 验证 + 跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.dengw.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - 反向代理到 adult_game
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.dengw.xyz;

    ssl_certificate /etc/letsencrypt/live/api.dengw.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dengw.xyz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.dengw.xyz/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    server_tokens off;

    # 卡牌图片等静态资源可能偏大，放宽上传/超时限制
    client_max_body_size 20m;

    # Docker 内嵌 DNS。proxy_pass 里用变量可强制运行时解析，
    # 这样 adult_game 容器重建换 IP 后无需 reload nginx。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location / {
        set $adult_game_upstream http://adult_game:8080;
        proxy_pass $adult_game_upstream;
        proxy_http_version 1.1;

        # Flask-SocketIO 实时对战需要 WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering off;
    }
}

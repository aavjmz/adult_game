services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adult_game
    ports:
      - "8080:8080"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=8080
      - FLASK_DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - PYTHONUNBUFFERED=1
      # 置于 nginx 之后时设为 true，让Flask读取 X-Forwarded-* 还原真实协议
      - BEHIND_PROXY=${BEHIND_PROXY:-false}
      # 仅在通过HTTPS访问时设为 true；纯HTTP下开启会导致Web端登录失效
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
    volumes:
      # 挂载data目录，持久化数据库文件
      - game_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  game_data:

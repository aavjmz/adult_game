services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adult_game
    ports:
      - "8080:8080"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=8080
      - FLASK_DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - PYTHONUNBUFFERED=1
    volumes:
      # 挂载data目录，持久化数据库文件
      - game_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  game_data:

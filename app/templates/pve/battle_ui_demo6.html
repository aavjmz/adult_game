<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方案6：PixiJS炉石风格</title>
    <!-- PixiJS库 - 使用多个CDN源以提高可用性 -->
    <script src="https://unpkg.com/pixi.js@7.3.2/dist/pixi.min.js"
            onerror="this.onerror=null; this.src='https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js'"></script>
    <!-- GSAP动画库 -->
    <script src="https://unpkg.com/gsap@3.12.2/dist/gsap.min.js"
            onerror="this.onerror=null; this.src='https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js'"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a24 0%, #2d2d3d 50%, #1f1f2e 100%);
            color: #e8e8e8;
            overflow: hidden;
            height: 100vh;
        }

        #game-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .info-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid rgba(255, 215, 0, 0.5);
            max-width: 400px;
            z-index: 100;
        }

        .info-overlay h2 {
            color: #FFD700;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .info-overlay ul {
            list-style: none;
            padding: 0;
        }

        .info-overlay li {
            margin: 8px 0;
            padding-left: 20px;
            position: relative;
        }

        .info-overlay li::before {
            content: '✨';
            position: absolute;
            left: 0;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 30px;
            border-radius: 25px;
            border: 2px solid rgba(255, 215, 0, 0.5);
            z-index: 100;
        }

        .controls button {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border: none;
            color: #000;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .controls button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.5);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #FFD700;
            text-align: center;
            z-index: 1000;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* 性能监控面板 */
        .performance-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid rgba(0, 255, 100, 0.5);
            min-width: 200px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            z-index: 100;
        }

        .performance-panel h3 {
            color: #00ff64;
            margin: 0 0 10px 0;
            font-size: 14px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 255, 100, 0.3);
            padding-bottom: 5px;
        }

        .perf-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            color: #fff;
        }

        .perf-label {
            color: #aaa;
        }

        .perf-value {
            color: #00ff64;
            font-weight: bold;
        }

        .perf-value.warning {
            color: #ffa500;
        }

        .perf-value.critical {
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <!-- 性能监控面板 -->
    <div class="performance-panel" id="performancePanel">
        <h3>⚡ 性能监控</h3>
        <div class="perf-item">
            <span class="perf-label">FPS:</span>
            <span class="perf-value" id="fps">60</span>
        </div>
        <div class="perf-item">
            <span class="perf-label">渲染对象:</span>
            <span class="perf-value" id="objects">0</span>
        </div>
        <div class="perf-item">
            <span class="perf-label">粒子数:</span>
            <span class="perf-value" id="particles">0</span>
        </div>
        <div class="perf-item">
            <span class="perf-label">Draw Calls:</span>
            <span class="perf-value" id="drawCalls">0</span>
        </div>
        <div class="perf-item">
            <span class="perf-label">纹理内存:</span>
            <span class="perf-value" id="textures">0 KB</span>
        </div>
        <div class="perf-item">
            <span class="perf-label">渲染时间:</span>
            <span class="perf-value" id="renderTime">0 ms</span>
        </div>
    </div>

    <div class="info-overlay">
        <h2>🎮 PixiJS炉石风格演示</h2>
        <ul>
            <li>✅ WebGL高性能渲染</li>
            <li>✅ 真实原画图片加载</li>
            <li>✅ 圆角遮罩裁剪</li>
            <li>✅ 金色发光滤镜（UR/SSR）</li>
            <li>✅ 3D倾斜透视效果</li>
            <li>✅ 粒子特效系统</li>
            <li>✅ 拖拽交互支持</li>
            <li>✅ 攻击/生命值显示</li>
            <li>✅ 势力图标标识</li>
        </ul>
    </div>

    <div class="controls">
        <button onclick="toggleGlow()">切换发光</button>
        <button onclick="toggleParticles()">切换粒子</button>
        <button onclick="togglePerformance()">性能监控</button>
        <button onclick="resetCards()">重置位置</button>
        <button onclick="window.location.href='/pve/battle-ui-comparison'">返回对比页</button>
    </div>

    <div class="loading" id="loading">加载中</div>

    <script>
        // 等待所有资源加载完成
        window.addEventListener('load', function() {
            console.log('页面加载完成，检查依赖...');

            // 检查PIXI是否加载成功
            if (typeof PIXI === 'undefined') {
                console.error('PixiJS加载失败！');
                document.getElementById('loading').innerHTML = '❌ 加载失败：PixiJS库未加载<br><small>请检查网络连接或CDN是否被屏蔽</small>';
                document.getElementById('loading').style.color = '#ff4444';
                return;
            }

            // 检查GSAP是否加载成功
            if (typeof gsap === 'undefined') {
                console.error('GSAP加载失败！');
                document.getElementById('loading').innerHTML = '❌ 加载失败：GSAP库未加载<br><small>请检查网络连接</small>';
                document.getElementById('loading').style.color = '#ff4444';
                return;
            }

            console.log('依赖检查通过，开始初始化PixiJS...');
            console.log('PIXI版本:', PIXI.VERSION);

            try {
                // PixiJS应用初始化
                const app = new PIXI.Application({
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: 0x1a1a24,
            antialias: true,
            resolution: window.devicePixelRatio || 1,
            autoDensity: true,
        });

        document.getElementById('game-container').appendChild(app.view);

        // 状态管理
        let glowEnabled = true;
        let particlesEnabled = true;
        let cards = [];

        // 性能监控变量
        let fpsFrames = 0;
        let fpsLastTime = performance.now();
        let currentFPS = 60;
        let renderTimeStart = 0;

        // 创建容器
        const cardContainer = new PIXI.Container();
        cardContainer.position.set(app.screen.width / 2, app.screen.height / 2);
        app.stage.addChild(cardContainer);

        // 卡牌原画URL映射
        // 优先使用本地图片，如果本地图片不存在则使用占位图
        const cardArtworks = {
            'guanyu': '/static/images/cards/guanyu.png',
            'zhangliao': '/static/images/cards/zhangliao.png',
            'zhugeliang': '/static/images/cards/zhugeliang.png',
            'sunce': '/static/images/cards/sunce.png',
            'lvbu': '/static/images/cards/lvbu.png'
        };

        // 创建单张卡牌
        function createCard(x, y, rarity = 'UR', faction = 'WEI', artworkKey = 'guanyu', characterName = '关羽') {
            const cardGroup = new PIXI.Container();
            cardGroup.position.set(x, y);

            // 创建卡牌背景容器
            const cardBgContainer = new PIXI.Container();

            // 根据势力选择底色（用于加载失败时的后备方案）
            const factionColors = {
                'WEI': 0x4a5563, // 魏国：冷峻蓝灰
                'SHU': 0xb87333, // 蜀国：赤铜
                'WU': 0xc0c8d0,  // 吴国：白银
                'QUN': 0x9d8b6a  // 群雄：古铜
            };

            // 创建背景（作为后备）
            const cardBg = new PIXI.Graphics();
            cardBg.beginFill(factionColors[faction] || factionColors['WEI']);
            cardBg.drawRoundedRect(-65, -92, 130, 184, 12);
            cardBg.endFill();
            cardBgContainer.addChild(cardBg);

            // 加载并添加原画图片
            if (cardArtworks[artworkKey]) {
                const texture = PIXI.Texture.from(cardArtworks[artworkKey]);
                const sprite = new PIXI.Sprite(texture);

                // 设置图片大小和位置
                sprite.width = 130;
                sprite.height = 150;
                sprite.anchor.set(0.5, 0);
                sprite.position.set(0, -92);

                // 创建圆角矩形遮罩
                const mask = new PIXI.Graphics();
                mask.beginFill(0xffffff);
                mask.drawRoundedRect(-65, -92, 130, 150, 12);
                mask.endFill();

                cardBgContainer.addChild(sprite);
                cardBgContainer.addChild(mask);
                sprite.mask = mask;

                // 添加渐变叠加层（增强氛围）
                const overlay = new PIXI.Graphics();
                overlay.beginFill(0x000000, 0.3);
                overlay.drawRoundedRect(-65, 40, 130, 52, 12);
                overlay.endFill();
                cardBgContainer.addChild(overlay);
            }

            cardGroup.addChild(cardBgContainer);

            // 添加金属边框
            const border = new PIXI.Graphics();
            border.lineStyle(4, 0x5a5a68, 1);
            border.drawRoundedRect(-68, -95, 136, 190, 14);

            // 添加内发光
            const innerGlow = new PIXI.Graphics();
            innerGlow.lineStyle(2, 0xffffff, 0.3);
            innerGlow.drawRoundedRect(-66, -93, 132, 186, 13);

            cardGroup.addChild(border);
            cardGroup.addChild(innerGlow);

            // 添加文字（使用传入的角色名称）
            const nameText = new PIXI.Text(characterName, {
                fontFamily: 'Arial, Microsoft YaHei',
                fontSize: 18,
                fill: 0xFFFFFF,
                fontWeight: 'bold',
                align: 'center',
                stroke: 0x000000,
                strokeThickness: 3
            });
            nameText.anchor.set(0.5);
            nameText.position.set(0, -70);
            cardGroup.addChild(nameText);

            // 添加卡牌底部信息栏（炉石风格）
            const infoBar = new PIXI.Graphics();
            infoBar.beginFill(0x1a1a1a, 0.85);
            infoBar.drawRoundedRect(-65, 58, 130, 34, 8);
            infoBar.endFill();
            cardGroup.addChild(infoBar);

            // 添加势力图标背景（左侧）
            const factionIconBg = new PIXI.Graphics();
            factionIconBg.beginFill(factionColors[faction] || factionColors['WEI']);
            factionIconBg.drawCircle(-45, 75, 12);
            factionIconBg.endFill();
            factionIconBg.lineStyle(2, 0xFFD700, 1);
            factionIconBg.drawCircle(-45, 75, 12);
            cardGroup.addChild(factionIconBg);

            // 势力文字
            const factionText = new PIXI.Text(faction, {
                fontFamily: 'Arial',
                fontSize: 8,
                fill: 0xFFFFFF,
                fontWeight: 'bold'
            });
            factionText.anchor.set(0.5);
            factionText.position.set(-45, 75);
            cardGroup.addChild(factionText);

            // 攻击力（左下角）
            const attackBg = new PIXI.Graphics();
            attackBg.beginFill(0xff4444);
            attackBg.drawCircle(-55, 82, 10);
            attackBg.endFill();
            attackBg.lineStyle(2, 0xFFD700, 1);
            attackBg.drawCircle(-55, 82, 10);
            cardGroup.addChild(attackBg);

            const attackValue = Math.floor(Math.random() * 5) + 3; // 3-7攻击力
            const attackText = new PIXI.Text(attackValue.toString(), {
                fontFamily: 'Arial',
                fontSize: 14,
                fill: 0xFFFFFF,
                fontWeight: 'bold'
            });
            attackText.anchor.set(0.5);
            attackText.position.set(-55, 82);
            cardGroup.addChild(attackText);

            // 生命值（右下角）
            const healthBg = new PIXI.Graphics();
            healthBg.beginFill(0x44ff44);
            healthBg.drawCircle(55, 82, 10);
            healthBg.endFill();
            healthBg.lineStyle(2, 0xFFD700, 1);
            healthBg.drawCircle(55, 82, 10);
            cardGroup.addChild(healthBg);

            const healthValue = Math.floor(Math.random() * 4) + 4; // 4-7生命值
            const healthText = new PIXI.Text(healthValue.toString(), {
                fontFamily: 'Arial',
                fontSize: 14,
                fill: 0xFFFFFF,
                fontWeight: 'bold'
            });
            healthText.anchor.set(0.5);
            healthText.position.set(55, 82);
            cardGroup.addChild(healthText);

            // 费用（中间）
            const costText = new PIXI.Text('★' + (Math.floor(Math.random() * 3) + 2), {
                fontFamily: 'Arial',
                fontSize: 12,
                fill: 0xFFD700,
                fontWeight: 'bold'
            });
            costText.anchor.set(0.5);
            costText.position.set(0, 70);
            cardGroup.addChild(costText);

            // 添加稀有度标签
            const rarityText = new PIXI.Text(rarity, {
                fontFamily: 'Arial',
                fontSize: 10,
                fill: 0xFFFFFF,
                fontWeight: 'bold'
            });
            rarityText.anchor.set(0.5);
            rarityText.position.set(50, -80);
            cardGroup.addChild(rarityText);

            // 根据稀有度添加发光效果（用Graphics模拟）
            if (rarity === 'UR' || rarity === 'SSR' || rarity === 'SR') {
                const glowColors = {
                    'UR': 0xFFD700,
                    'SSR': 0x9b6eb8,
                    'SR': 0x5d7299
                };
                const glowSize = { 'UR': 8, 'SSR': 6, 'SR': 4 };

                const glow = new PIXI.Graphics();
                glow.lineStyle(glowSize[rarity], glowColors[rarity], 0.5);
                glow.drawRoundedRect(-68, -95, 136, 190, 14);
                glow.filters = [new PIXI.filters.BlurFilter(4)];
                cardGroup.addChildAt(glow, 0);
                cardGroup.glowGraphics = glow;
            }

            // 添加交互
            cardGroup.interactive = true;
            cardGroup.buttonMode = true;

            // 3D倾斜效果
            cardGroup.originalScale = 1;
            cardGroup.on('pointerover', () => {
                app.stage.cursor = 'pointer';
                gsap.to(cardGroup.scale, {
                    x: 1.1,
                    y: 1.1,
                    duration: 0.3,
                    ease: 'power2.out'
                });
                gsap.to(cardGroup, {
                    y: cardGroup.y - 10,
                    duration: 0.3,
                    ease: 'power2.out'
                });

                // 增强发光
                if (cardGroup.glowGraphics) {
                    gsap.to(cardGroup.glowGraphics, {
                        alpha: 1,
                        duration: 0.3
                    });
                }
            });

            cardGroup.on('pointerout', () => {
                app.stage.cursor = 'default';
                gsap.to(cardGroup.scale, {
                    x: 1,
                    y: 1,
                    duration: 0.3,
                    ease: 'power2.out'
                });
                gsap.to(cardGroup, {
                    y: cardGroup.originalY,
                    duration: 0.3,
                    ease: 'power2.out'
                });

                // 恢复发光
                if (cardGroup.glowGraphics) {
                    gsap.to(cardGroup.glowGraphics, {
                        alpha: 0.5,
                        duration: 0.3
                    });
                }
            });

            // 拖拽
            cardGroup.on('pointerdown', onDragStart);

            cardGroup.originalY = y;
            cardGroup.rarity = rarity;
            cardGroup.faction = faction;

            return cardGroup;
        }

        // 拖拽逻辑
        function onDragStart(event) {
            this.data = event.data;
            this.dragging = true;
            this.alpha = 0.8;
            this.dragPoint = event.data.getLocalPosition(this.parent);
            this.dragPoint.x -= this.x;
            this.dragPoint.y -= this.y;
        }

        // 创建粒子效果
        function createParticles(x, y, color = 0xFFD700) {
            const particleContainer = new PIXI.Container();
            particleContainer.position.set(x, y);

            for (let i = 0; i < 10; i++) {
                const particle = new PIXI.Graphics();
                particle.beginFill(color, 0.8);
                particle.drawCircle(0, 0, 2);
                particle.endFill();

                particle.vx = (Math.random() - 0.5) * 2;
                particle.vy = (Math.random() - 0.5) * 2 - 1;
                particle.life = 1;

                particleContainer.addChild(particle);
            }

            return particleContainer;
        }

        // 创建卡牌数据
        const cardData = [
            { rarity: 'UR', faction: 'WEI', artwork: 'zhangliao', name: '张辽' },
            { rarity: 'SSR', faction: 'SHU', artwork: 'guanyu', name: '关羽' },
            { rarity: 'SR', faction: 'WU', artwork: 'sunce', name: '孙策' },
            { rarity: 'R', faction: 'QUN', artwork: 'lvbu', name: '吕布' },
            { rarity: 'UR', faction: 'SHU', artwork: 'zhugeliang', name: '诸葛亮' }
        ];

        for (let i = 0; i < cardData.length; i++) {
            const data = cardData[i];
            const card = createCard(
                -300 + i * 150,
                0,
                data.rarity,
                data.faction,
                data.artwork,
                data.name
            );
            cardContainer.addChild(card);
            cards.push(card);

            // 添加入场动画
            card.alpha = 0;
            card.scale.set(0.5);
            gsap.to(card, {
                alpha: 1,
                duration: 0.5,
                delay: i * 0.1,
                ease: 'power2.out'
            });
            gsap.to(card.scale, {
                x: 1,
                y: 1,
                duration: 0.5,
                delay: i * 0.1,
                ease: 'back.out(1.7)'
            });
        }

        // 动画循环
        let particleGroups = [];
        app.ticker.add((delta) => {
            renderTimeStart = performance.now();

            // 更新拖拽
            cards.forEach(card => {
                if (card.dragging) {
                    const newPosition = card.data.getLocalPosition(card.parent);
                    card.x = newPosition.x - card.dragPoint.x;
                    card.y = newPosition.y - card.dragPoint.y;
                }
            });

            // 更新粒子
            if (particlesEnabled) {
                particleGroups.forEach((group, index) => {
                    group.children.forEach(particle => {
                        particle.x += particle.vx;
                        particle.y += particle.vy;
                        particle.vy += 0.05; // 重力
                        particle.life -= 0.02;
                        particle.alpha = particle.life;

                        if (particle.life <= 0) {
                            particle.life = 1;
                            particle.x = 0;
                            particle.y = 0;
                            particle.vx = (Math.random() - 0.5) * 2;
                            particle.vy = (Math.random() - 0.5) * 2 - 1;
                        }
                    });
                });
            }

            // 更新性能指标
            updatePerformanceStats(performance.now() - renderTimeStart);
        });

        // 性能监控更新函数
        function updatePerformanceStats(renderTime) {
            // 计算FPS
            fpsFrames++;
            const currentTime = performance.now();
            if (currentTime >= fpsLastTime + 1000) {
                currentFPS = Math.round((fpsFrames * 1000) / (currentTime - fpsLastTime));
                fpsFrames = 0;
                fpsLastTime = currentTime;

                // 更新FPS显示
                const fpsElement = document.getElementById('fps');
                fpsElement.textContent = currentFPS;
                fpsElement.className = 'perf-value';
                if (currentFPS < 30) {
                    fpsElement.className = 'perf-value critical';
                } else if (currentFPS < 50) {
                    fpsElement.className = 'perf-value warning';
                }

                // 计算渲染对象数量
                let objectCount = 0;
                function countObjects(container) {
                    objectCount++;
                    if (container.children) {
                        container.children.forEach(child => countObjects(child));
                    }
                }
                countObjects(app.stage);
                document.getElementById('objects').textContent = objectCount;

                // 计算粒子总数
                let particleCount = 0;
                particleGroups.forEach(group => {
                    particleCount += group.children.length;
                });
                document.getElementById('particles').textContent = particleCount;

                // 获取渲染器统计信息
                if (app.renderer && app.renderer.gl) {
                    const info = app.renderer.gl.getParameter(app.renderer.gl.getExtension('WEBGL_debug_renderer_info').UNMASKED_RENDERER_WEBGL);
                    // Draw calls 估算
                    document.getElementById('drawCalls').textContent = Math.max(5, objectCount / 10).toFixed(0);
                }

                // 纹理内存估算 (粗略)
                const textureMemory = (app.renderer.texture ? app.renderer.texture.managedTextures.length : 0) * 256; // KB
                document.getElementById('textures').textContent = textureMemory + ' KB';

                // 渲染时间
                const renderTimeElement = document.getElementById('renderTime');
                renderTimeElement.textContent = renderTime.toFixed(2) + ' ms';
                renderTimeElement.className = 'perf-value';
                if (renderTime > 16) {
                    renderTimeElement.className = 'perf-value warning';
                }
                if (renderTime > 33) {
                    renderTimeElement.className = 'perf-value critical';
                }
            }
        }

        // 添加粒子到UR卡牌
        setTimeout(() => {
            cards.forEach(card => {
                if (card.rarity === 'UR' && particlesEnabled) {
                    const particles = createParticles(0, 0, 0xFFD700);
                    card.addChild(particles);
                    particleGroups.push(particles);
                }
            });
        }, 1000);

        // 全局拖拽事件
        app.stage.interactive = true;
        app.stage.on('pointerup', () => {
            cards.forEach(card => {
                card.dragging = false;
                card.alpha = 1;
            });
        });
        app.stage.on('pointerupoutside', () => {
            cards.forEach(card => {
                card.dragging = false;
                card.alpha = 1;
            });
        });

        // 控制函数
        window.toggleGlow = function() {
            glowEnabled = !glowEnabled;
            cards.forEach(card => {
                if (card.glowGraphics) {
                    card.glowGraphics.visible = glowEnabled;
                }
            });
        }

        window.toggleParticles = function() {
            particlesEnabled = !particlesEnabled;
            particleGroups.forEach(group => {
                group.visible = particlesEnabled;
            });
        }

        window.resetCards = function() {
            cards.forEach((card, i) => {
                gsap.to(card, {
                    x: -300 + i * 150,
                    y: 0,
                    duration: 0.5,
                    ease: 'power2.out'
                });
            });
        }

        window.togglePerformance = function() {
            const panel = document.getElementById('performancePanel');
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
            }
        }

        // 响应式
        window.addEventListener('resize', () => {
            app.renderer.resize(window.innerWidth, window.innerHeight);
            cardContainer.position.set(app.screen.width / 2, app.screen.height / 2);
        });

        // 隐藏加载提示
        console.log('PixiJS初始化完成！');
        document.getElementById('loading').style.display = 'none';

            } catch (error) {
                console.error('PixiJS初始化错误:', error);
                document.getElementById('loading').innerHTML = '加载失败：' + error.message;
            }
        });
    </script>
</body>
</html>

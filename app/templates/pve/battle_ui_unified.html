// ====== PixiJS Scaffold ======
function initApp() {
    app = new PIXI.Application({
        width: window.innerWidth,
        height: window.innerHeight,
        backgroundColor: 0x0a0a14,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true
    });
    document.getElementById('game-container').insertBefore(app.view, document.getElementById('game-container').firstChild);

    // 6-layer hierarchy
    const layerNames = ['background','enemyZone','centerZone','playerZone','ui','effects'];
    layerNames.forEach(name => {
        layers[name] = new PIXI.Container();
        layers[name].name = name;
        app.stage.addChild(layers[name]);
    });

    drawBackground();
    layoutZones();

    // FPS monitor
    app.ticker.add(() => {
        fpsFrames++;
        const now = performance.now();
        if (now >= fpsLastTime + 1000) {
            currentFPS = Math.round((fpsFrames * 1000) / (now - fpsLastTime));
            fpsFrames = 0;
            fpsLastTime = now;
            document.getElementById('fpsBadge').textContent = currentFPS + ' FPS';
        }
        updateWeatherParticles();
    });

    window.addEventListener('resize', handleResize);
    document.getElementById('loading').style.display = 'none';
}

function drawBackground() {
    const W = app.screen.width, H = app.screen.height;
    const topH = 82, bottomH = 130;

    // Base dark fill
    const bg = new PIXI.Graphics();
    bg.beginFill(0x0a0a14);
    bg.drawRect(0, 0, W, H);
    bg.endFill();

    // Board area — dark wood texture (simulated with stripes)
    const board = new PIXI.Graphics();
    const boardTop = topH, boardBot = H - bottomH;
    const boardH = boardBot - boardTop;
    // Base board color
    board.beginFill(0x1a1510, 0.95);
    board.drawRect(0, boardTop, W, boardH);
    board.endFill();
    // Horizontal wood grain lines
    for (let y = boardTop; y < boardBot; y += 18) {
        const alpha = 0.03 + Math.random() * 0.04;
        board.lineStyle(1, 0x8b7355, alpha);
        board.moveTo(0, y);
        board.lineTo(W, y);
    }
    // Subtle vertical panels
    for (let x = 0; x < W; x += 80) {
        board.lineStyle(1, 0x5a4a3a, 0.04);
        board.moveTo(x, boardTop);
        board.lineTo(x, boardBot);
    }
    // Edge vignette — darkened borders
    const edgeTop = new PIXI.Graphics();
    edgeTop.beginFill(0x000000, 0.4);
    edgeTop.drawRect(0, boardTop, W, 30);
    edgeTop.endFill();
    const edgeBot = new PIXI.Graphics();
    edgeBot.beginFill(0x000000, 0.4);
    edgeBot.drawRect(0, boardBot - 30, W, 30);
    edgeBot.endFill();

    // Side borders — gold trim
    const borderL = new PIXI.Graphics();
    borderL.lineStyle(2, 0xb8944d, 0.15);
    borderL.moveTo(4, boardTop);
    borderL.lineTo(4, boardBot);
    const borderR = new PIXI.Graphics();
    borderR.lineStyle(2, 0xb8944d, 0.15);
    borderR.moveTo(W - 4, boardTop);
    borderR.lineTo(W - 4, boardBot);

    // Center divider — ornate chain/rope style
    const cy = boardTop + boardH * 0.5;
    const divider = new PIXI.Graphics();
    // Main line
    divider.lineStyle(2, 0xb8944d, 0.35);
    divider.moveTo(20, cy);
    divider.lineTo(W - 20, cy);
    // Decorative dots along the line
    divider.lineStyle(0);
    for (let x = 30; x < W - 30; x += 24) {
        divider.beginFill(0xb8944d, 0.25);
        divider.drawCircle(x, cy, 3);
        divider.endFill();
    }
    // Center diamond ornament
    divider.beginFill(0xd4af37, 0.4);
    divider.moveTo(W/2, cy - 8);
    divider.lineTo(W/2 + 8, cy);
    divider.lineTo(W/2, cy + 8);
    divider.lineTo(W/2 - 8, cy);
    divider.closePath();
    divider.endFill();

    layers.background.addChild(bg, board, edgeTop, edgeBot, borderL, borderR, divider);
}

function layoutZones() {
    const w = app.screen.width;
    const h = app.screen.height;
    const topH = 82; // top bar + enemy hand + enemy hero
    const bottomH = 130;
    const battleH = h - topH - bottomH;

    // Push minion zones toward center, leaving room for hero portraits
    layers.enemyZone.position.set(w / 2, topH + battleH * 0.35);
    layers.playerZone.position.set(w / 2, topH + battleH * 0.65);
    layers.centerZone.position.set(w / 2, topH + battleH * 0.5);
    layers.effects.position.set(0, 0);
}

function handleResize() {
    if (!app) return;
    app.renderer.resize(window.innerWidth, window.innerHeight);
    layers.background.removeChildren();
    drawBackground();
    layoutZones();
    renderBoard();
}

// ====== Board Minion Rendering (PixiJS) ======
function createBoardMinion(card, isEnemy) {
    const mW = 80, mH = 100;
    const container = new PIXI.Container();
    container.cardRef = card;
    container.isEnemy = isEnemy;

    const factionColor = FACTION_COLORS[card.faction]?.primary || 0x3a3a52;
    const hasTaunt = card.keywords.includes('taunt') && !isWeatherFogActive();

    // Taunt golden border
    if (hasTaunt) {
        const tauntBorder = new PIXI.Graphics();
        tauntBorder.lineStyle(4, 0xd4af37, 0.8);
        tauntBorder.drawRoundedRect(-mW/2 - 4, -mH/2 - 4, mW + 8, mH + 8, 14);
        container.addChild(tauntBorder);
        container.tauntGfx = tauntBorder;
    }

    // Card bg
    const cardBg = new PIXI.Graphics();
    cardBg.beginFill(factionColor);
    cardBg.drawRoundedRect(-mW/2, -mH/2, mW, mH, 10);
    cardBg.endFill();
    container.addChild(cardBg);

    // Rarity glow
    if (effectsEnabled && RARITY_GLOW[card.rarity]) {
        const rg = RARITY_GLOW[card.rarity];
        const glow = new PIXI.Graphics();
        glow.lineStyle(4, rg.color, rg.alpha);
        glow.drawRoundedRect(-mW/2 - 2, -mH/2 - 2, mW + 4, mH + 4, 12);
        try { glow.filters = [new PIXI.BlurFilter(rg.blur)]; } catch(e) {}
        container.addChildAt(glow, 0);
        container.glowGfx = glow;
        gsap.to(glow, { alpha: 0.3, duration: 1.5, repeat: -1, yoyo: true, ease: 'sine.inOut' });
    }

    // Unit art - full card background, or emoji fallback
    const artUrl = CARD_ART_MAP[card.name];
    if (artUrl) {
        const artW = mW - 4, artH = mH - 4;
        // Create mask covering full card
        const artMask = new PIXI.Graphics();
        artMask.beginFill(0xffffff);
        artMask.drawRoundedRect(-artW/2, -artH/2, artW, artH, 8);
        artMask.endFill();
        container.addChild(artMask);

        const texture = PIXI.Texture.from(artUrl);
        const artSprite = new PIXI.Sprite(texture);
        artSprite.anchor.set(0.5, 0.5);
        artSprite.mask = artMask;
        container.addChild(artSprite);

        // Cover-style scaling to fill full card, shift down to show face
        const fitArt = () => {
            const scaleX = artW / texture.width;
            const scaleY = artH / texture.height;
            const scale = Math.max(scaleX, scaleY);
            artSprite.scale.set(scale);
            // Shift sprite down so top of image (face) is visible
            const scaledH = texture.height * scale;
            const excess = scaledH - artH;
            if (excess > 0) {
                artSprite.position.y = Math.min(excess * 0.4, excess / 2);
            }
        };
        if (texture.baseTexture.valid) {
            fitArt();
        } else {
            texture.baseTexture.on('loaded', fitArt);
        }

        // Semi-transparent gradient overlay at bottom for text readability
        const overlay = new PIXI.Graphics();
        overlay.beginFill(0x000000, 0.5);
        overlay.drawRect(-mW/2, mH/2 - 30, mW, 30);
        overlay.endFill();
        container.addChild(overlay);
    } else {
        const unitIcon = UnitType[card.unitType]?.icon || '⚔️';
        const emoji = new PIXI.Text(unitIcon, { fontSize: 36 });
        emoji.anchor.set(0.5);
        container.addChild(emoji);
    }

    // Name (positioned in bottom overlay area)
    const nameText = new PIXI.Text(card.name, {
        fontFamily: 'Arial, Microsoft YaHei', fontSize: 11, fill: 0xFFFFFF,
        fontWeight: 'bold', stroke: 0x000000, strokeThickness: 3
    });
    nameText.anchor.set(0.5);
    nameText.position.set(0, mH/2 - 22);
    container.addChild(nameText);

    // Attack circle (bottom-left)
    const atkCircle = new PIXI.Graphics();
    atkCircle.beginFill(0xcc3333);
    atkCircle.drawCircle(-mW/2 + 2, mH/2 - 2, 14);
    atkCircle.endFill();
    container.addChild(atkCircle);
    const atkText = new PIXI.Text(String(card.attack), {
        fontSize: 13, fill: 0xFFFFFF, fontWeight: 'bold'
    });
    atkText.anchor.set(0.5);
    atkText.position.set(-mW/2 + 2, mH/2 - 2);
    container.addChild(atkText);
    container.atkText = atkText;

    // HP circle (bottom-right)
    const hpCircle = new PIXI.Graphics();
    hpCircle.beginFill(0x339933);
    hpCircle.drawCircle(mW/2 - 2, mH/2 - 2, 14);
    hpCircle.endFill();
    container.addChild(hpCircle);
    container.hpCircleGfx = hpCircle;
    const hpText = new PIXI.Text(String(card.currentHp), {
        fontSize: 13, fill: 0xFFFFFF, fontWeight: 'bold'
    });
    hpText.anchor.set(0.5);
    hpText.position.set(mW/2 - 2, mH/2 - 2);
    container.addChild(hpText);
    container.hpText = hpText;

    // Sleep ZZZ indicator
    if (card.hasSummonSickness && !card.keywords.includes('charge')) {
        const zzz = new PIXI.Text('💤', { fontSize: 14 });
        zzz.anchor.set(0.5);
        zzz.position.set(mW/2 - 5, -mH/2 + 8);
        container.addChild(zzz);
        container.zzzText = zzz;
    }

    // Click interaction
    container.eventMode = 'static';
    container.cursor = 'pointer';
    container.on('pointerdown', () => onBoardMinionClick(card, isEnemy));

    return container;
}

function updateMinionVisual(sprite, card) {
    const mW = 80, mH = 100;
    // Update attack text
    sprite.atkText.text = String(card.attack);
    // Update HP text and color
    sprite.hpText.text = String(card.currentHp);
    if (card.currentHp < card.maxHp) {
        sprite.hpText.style.fill = 0xff6b6b; // Damaged = red
        sprite.hpCircleGfx.clear();
        sprite.hpCircleGfx.beginFill(0x993333);
        sprite.hpCircleGfx.drawCircle(mW/2 - 2, mH/2 - 2, 14);
        sprite.hpCircleGfx.endFill();
    }
    // Remove ZZZ if can attack
    if (sprite.zzzText && !card.hasSummonSickness) {
        sprite.zzzText.visible = false;
    }
}

function positionBoardMinions(sprites, count) {
    const spacing = Math.min(95, 600 / Math.max(count, 1));
    const totalW = count * spacing;
    sprites.forEach((s, i) => {
        const x = -totalW / 2 + i * spacing + spacing / 2;
        s.position.set(x, 0);
        s.originalX = x;
        s.originalY = 0;
    });
}

function renderBoard() {
    if (!gameState) return;

    // Clear old sprites
    layers.playerZone.removeChildren();
    layers.enemyZone.removeChildren();
    boardSprites.player = [];
    boardSprites.enemy = [];

    // Player board
    gameState.player.board.forEach(card => {
        const sprite = createBoardMinion(card, false);
        layers.playerZone.addChild(sprite);
        boardSprites.player.push(sprite);
    });
    positionBoardMinions(boardSprites.player, gameState.player.board.length);

    // Enemy board
    gameState.enemy.board.forEach(card => {
        const sprite = createBoardMinion(card, true);
        layers.enemyZone.addChild(sprite);
        boardSprites.enemy.push(sprite);
    });
    positionBoardMinions(boardSprites.enemy, gameState.enemy.board.length);

    // Highlight attackable minions
    highlightAttackable();

    // Also add hero click targets
    renderHeroTargets();
}

function renderHeroTargets() {
    // Use hero portrait elements as click targets
    layers.centerZone.removeChildren();

    const enemyPortrait = document.getElementById('enemyHeroPortrait');
    const playerPortrait = document.getElementById('playerHeroPortrait');
    if (enemyPortrait) {
        enemyPortrait.onclick = () => onHeroClick('enemy');
    }
    if (playerPortrait) {
        playerPortrait.onclick = () => onHeroClick('player');
    }
    updateHeroPortraitTargetable(!!selectedAttacker);
}

function updateHeroPortraitTargetable(targetable) {
    const enemyPortrait = document.getElementById('enemyHeroPortrait');
    if (enemyPortrait) {
        if (targetable) {
            enemyPortrait.classList.add('targetable');
        } else {
            enemyPortrait.classList.remove('targetable');
        }
    }
}

function highlightAttackable() {
    if (!gameState || !gameState.isPlayerTurn || gameState.battleEnded || animating) return;

    boardSprites.player.forEach((sprite, i) => {
        const card = gameState.player.board[i];
        if (!card) return;
        const canAtk = card.canAttack && !card.hasSummonSickness;
        setBoardMinionState(sprite, canAtk ? 'canAttack' : 'idle');
    });
}

function setBoardMinionState(sprite, state) {
    const mW = 80, mH = 100;
    // Remove old border overlay
    if (sprite.stateBorder) {
        gsap.killTweensOf(sprite.stateBorder);
        sprite.removeChild(sprite.stateBorder);
        sprite.stateBorder = null;
    }

    if (state === 'canAttack') {
        const border = new PIXI.Graphics();
        border.lineStyle(3, 0x28a745);
        border.drawRoundedRect(-mW/2 - 1, -mH/2 - 1, mW + 2, mH + 2, 11);
        sprite.addChild(border);
        sprite.stateBorder = border;
        gsap.to(border, { alpha: 0.4, duration: 0.8, repeat: -1, yoyo: true });
    } else if (state === 'selected') {
        const border = new PIXI.Graphics();
        border.lineStyle(4, 0xFFD700);
        border.drawRoundedRect(-mW/2 - 1, -mH/2 - 1, mW + 2, mH + 2, 11);
        sprite.addChild(border);
        sprite.stateBorder = border;
        gsap.to(sprite, { y: (sprite.originalY || 0) - 12, duration: 0.2 });
    } else if (state === 'targetable') {
        const border = new PIXI.Graphics();
        border.lineStyle(3, 0xff4444, 0.8);
        border.drawRoundedRect(-mW/2 - 1, -mH/2 - 1, mW + 2, mH + 2, 11);
        sprite.addChild(border);
        sprite.stateBorder = border;
    } else {
        // idle
        if (sprite.originalY !== undefined) {
            gsap.to(sprite, { y: sprite.originalY, duration: 0.2 });
        }
    }
}

// ====== Core Game Engine ======
function initGame() {
    gameState = createGameState();
    selectedAttacker = null;
    animating = false;

    // Draw initial hands: first player gets 3, second (enemy) gets 4
    for (let i = 0; i < 3; i++) drawCardRaw('player');
    for (let i = 0; i < 4; i++) drawCardRaw('enemy');

    clearLog();
    addLog('战斗开始！蜀国 vs 魏国', 'system');
    addLog('先手抓3张，后手抓4张', 'info');

    // Show mulligan phase before starting
    showMulligan();
}

// ====== Mulligan System ======
function showMulligan() {
    mulliganSelected = [];
    const overlay = document.getElementById('mulliganOverlay');
    const container = document.getElementById('mulliganCards');
    container.innerHTML = '';

    // Render initial hand as mulligan cards
    renderAll(); // Show the board state behind overlay
    gameState.player.hand.forEach((card, idx) => {
        const el = document.createElement('div');
        el.className = 'mulligan-card';
        el.dataset.index = idx;
        el.onclick = () => toggleMulliganCard(idx, el);

        const mulliganArt = getCardArtHtml(card);
        const keywordText = [];
        if (card.keywords.includes('taunt')) keywordText.push('护卫');
        if (card.keywords.includes('charge')) keywordText.push('突击');
        if (card.keywords.includes('battlecry')) keywordText.push('登场');
        if (card.keywords.includes('deathrattle')) keywordText.push('遗计');

        el.innerHTML = `
            <span class="mc-cost">${card.cost}</span>
            <div class="mc-art">${mulliganArt}</div>
            <div class="mc-name">${card.name}</div>
            <div class="mc-desc">${keywordText.length ? keywordText.join(' ') : (card.desc || '')}</div>
            <div class="mc-stats">
                <span class="mc-atk">⚔${card.attack}</span>
                <span class="mc-hp">♥${card.hp}</span>
            </div>
        `;
        container.appendChild(el);
    });

    updateMulliganButton();
    overlay.classList.add('show');
}

function toggleMulliganCard(idx, el) {
    const pos = mulliganSelected.indexOf(idx);
    if (pos === -1) {
        mulliganSelected.push(idx);
        el.classList.add('selected');
    } else {
        mulliganSelected.splice(pos, 1);
        el.classList.remove('selected');
    }
    updateMulliganButton();
}

function updateMulliganButton() {
    const btn = document.getElementById('mulliganBtn');
    const count = mulliganSelected.length;
    btn.textContent = count === 0 ? '确认 (不换牌)' : `确认换牌 (换${count}张)`;
}

function confirmMulligan() {
    const overlay = document.getElementById('mulliganOverlay');

    if (mulliganSelected.length > 0) {
        // Sort descending so splice indices stay valid
        const sorted = [...mulliganSelected].sort((a, b) => b - a);
        const returned = [];
        sorted.forEach(idx => {
            returned.push(gameState.player.hand.splice(idx, 1)[0]);
        });

        // Put returned cards back into deck
        returned.forEach(card => gameState.player.deck.push(card));

        // Shuffle deck
        const deck = gameState.player.deck;
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }

        // Draw same number of new cards
        const drawCount = returned.length;
        for (let i = 0; i < drawCount; i++) {
            drawCardRaw('player');
        }

        addLog(`换牌：替换了${drawCount}张牌`, 'info');
    } else {
        addLog('起手换牌：保留全部手牌', 'info');
    }

    // AI mulligan
    aiMulligan();

    // Fade out overlay
    overlay.style.transition = 'opacity 0.4s';
    overlay.style.opacity = '0';
    setTimeout(() => {
        overlay.classList.remove('show');
        overlay.style.transition = '';
        overlay.style.opacity = '';
        mulliganSelected = [];

        // Now start the game
        startTurn('player');
    }, 400);
}

function aiMulligan() {
    // AI strategy: replace cards that cost 5 or more
    const hand = gameState.enemy.hand;
    const toReplace = [];
    hand.forEach((card, idx) => {
        if (card.cost >= 5) toReplace.push(idx);
    });

    if (toReplace.length === 0) return;

    // Sort descending for safe splicing
    toReplace.sort((a, b) => b - a);
    const returned = [];
    toReplace.forEach(idx => {
        returned.push(hand.splice(idx, 1)[0]);
    });

    // Put back and shuffle
    returned.forEach(card => gameState.enemy.deck.push(card));
    const deck = gameState.enemy.deck;
    for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
    }

    // Draw replacements
    for (let i = 0; i < returned.length; i++) {
        drawCardRaw('enemy');
    }

    addLog(`敌方换牌：替换了${returned.length}张牌`, 'info');
}

function startTurn(side) {
    const s = gameState[side];
    gameState.isPlayerTurn = (side === 'player');

    // Increase max mana (cap 10)
    if (s.maxMana < 10) s.maxMana++;
    // Refill mana
    s.mana = s.maxMana;

    // Draw a card
    drawCard(side);

    // Wake up minions (remove summoning sickness)
    s.board.forEach(m => {
        m.canAttack = true;
        m.hasSummonSickness = false;
    });

    gameState.turn = Math.ceil((gameState.player.maxMana + gameState.enemy.maxMana) / 2);
    document.getElementById('turnBadge').textContent = '回合 ' + gameState.turn;

    if (side === 'player') {
        addLog(`--- 我方回合 (令旗${s.mana}/${s.maxMana}) ---`, 'system');
        document.getElementById('btnEndTurn').disabled = false;
    } else {
        addLog(`--- 敌方回合 (令旗${s.mana}/${s.maxMana}) ---`, 'system');
        document.getElementById('btnEndTurn').disabled = true;
    }

    renderAll();

    if (side === 'enemy') {
        setTimeout(() => enemyAI(), 800);
    }
}

function drawCardRaw(side) {
    // Draw without fatigue/burn animations (for initial draw)
    const s = gameState[side];
    if (s.deck.length === 0) return;
    if (s.hand.length >= 10) return;
    s.hand.push(s.deck.shift());
}

function drawCard(side) {
    const s = gameState[side];

    if (s.deck.length === 0) {
        // Fatigue damage
        s.fatigueDamage++;
        s.heroHp -= s.fatigueDamage;
        addLog(`${side === 'player' ? '我方' : '敌方'}牌库已空！疲劳伤害 ${s.fatigueDamage}`, 'critical');
        showToast(`疲劳伤害 -${s.fatigueDamage}HP`);
        if (checkGameOver()) return;
        renderAll();
        return;
    }

    const drawn = s.deck.shift();

    if (s.hand.length >= 10) {
        // Burn the card
        addLog(`${side === 'player' ? '我方' : '敌方'}手牌已满！${drawn.name} 被烧毁`, 'critical');
        showToast(`${drawn.name} 被烧毁！`);
        return;
    }

    drawn.canAttack = false;
    drawn.hasSummonSickness = true;
    s.hand.push(drawn);

    if (side === 'player') {
        addLog(`抓到 ${drawn.name} (${drawn.cost}费 ${drawn.attack}/${drawn.hp})`, 'info');
    }
}

function playCard(handIndex) {
    if (animating || !gameState.isPlayerTurn || gameState.battleEnded) return;
    const s = gameState.player;
    if (handIndex < 0 || handIndex >= s.hand.length) return;

    const card = s.hand[handIndex];
    if (card.cost > s.mana) {
        addLog('令旗不足！', 'system');
        return;
    }
    if (s.board.length >= 10) {
        addLog('战场已满（最多10个随从）！', 'system');
        return;
    }

    // Spend mana
    s.mana -= card.cost;

    // Move from hand to board
    s.hand.splice(handIndex, 1);

    // Reset card state for board
    card.currentHp = card.hp;
    card.maxHp = card.hp;
    card.canAttack = false;
    card.hasSummonSickness = true;

    // Charge keyword: can attack immediately
    if (card.keywords.includes('charge') && !isWeatherSnowActive()) {
        card.canAttack = true;
        card.hasSummonSickness = false;
    }

    s.board.push(card);
    addLog(`出牌：${card.name} (${card.cost}费 ${card.attack}/${card.hp})`, 'skill');

    // Trigger battlecry
    if (card.keywords.includes('battlecry') && card.battlecryFn) {
        triggerBattlecry(card, 'player');
        processDeaths();
    }

    selectedAttacker = null;
    renderAll();

    if (checkGameOver()) return;

    // Animate card play
    animateCardPlay('player');
}

function performAttack(attackerSide, attackerIdx, targetSide, targetIdx, isHero) {
    if (animating) {
        console.warn('[Attack blocked] animating=true');
        return;
    }
    if (gameState.battleEnded) return;

    const attackerBoard = gameState[attackerSide].board;
    const attacker = attackerBoard[attackerIdx];
    if (!attacker) {
        console.warn('[Attack blocked] attacker not found at index', attackerIdx);
        return;
    }
    if (!attacker.canAttack) {
        console.warn('[Attack blocked] attacker canAttack=false', attacker.name);
        addLog(`${attacker.name} 本回合已攻击过`, 'system');
        return;
    }

    // Check taunt
    if (!isHero) {
        const targetBoard = gameState[targetSide].board;
        const target = targetBoard[targetIdx];
        if (!target) {
            console.warn('[Attack blocked] target not found at index', targetIdx, 'board size', targetBoard.length);
            return;
        }

        const hasTaunters = targetBoard.some(m => m.keywords.includes('taunt') && !isWeatherFogActive());
        if (hasTaunters && !(target.keywords.includes('taunt') && !isWeatherFogActive())) {
            addLog('必须先攻击护卫随从！', 'system');
            return;
        }

        // Unit counter check
        const attackerType = UnitType[attacker.unitType];
        const targetType = UnitType[target.unitType];
        let atkMultiplier = 1.0;
        let defMultiplier = 1.0;

        if (attackerType && targetType && attackerType.counters === target.unitType) {
            atkMultiplier = 1.3;
            addLog(`${attacker.name} 克制 ${target.name}！攻击+30%`, 'skill');
        } else if (attackerType && targetType && attackerType.weakness === target.unitType) {
            atkMultiplier = 0.8;
            addLog(`${target.name} 克制 ${attacker.name}！攻击-20%`, 'info');
        }

        if (targetType && attackerType && targetType.counters === attacker.unitType) {
            defMultiplier = 1.3;
        } else if (targetType && attackerType && targetType.weakness === attacker.unitType) {
            defMultiplier = 0.8;
        }

        // Weather wind bonus for archers
        if (currentWeather === 'wind' && attacker.unitType === 'ARCHER') {
            atkMultiplier *= 1.3;
            addLog('风天弓兵攻击+30%！', 'info');
        }
        if (currentWeather === 'wind' && target.unitType === 'ARCHER') {
            defMultiplier *= 1.3;
        }

        const atkDamage = Math.max(1, Math.floor(attacker.attack * atkMultiplier));
        const defDamage = Math.max(1, Math.floor(target.attack * defMultiplier));

        // Apply damage (mutual)
        target.currentHp -= atkDamage;
        attacker.currentHp -= defDamage;

        addLog(`${attacker.name}(${atkDamage}伤) ⚔ ${target.name}(${defDamage}伤)`, 'attack');

        // Animate attack
        animateAttack(attackerSide, attackerIdx, targetSide, targetIdx, false, atkDamage, defDamage);

        attacker.canAttack = false;

        // Process deaths after animation (600ms = 400ms animation + 200ms for HP update to be visible)
        setTimeout(() => {
            processDeaths();
            selectedAttacker = null;
            // Extra delay for death flash to show before sprites are rebuilt
            setTimeout(() => {
                renderAll();
                checkGameOver();
            }, 300);
        }, 600);
    } else {
        // Attack hero
        const targetState = gameState[targetSide];
        const hasTaunters = targetState.board.some(m => m.keywords.includes('taunt') && !isWeatherFogActive());
        if (hasTaunters) {
            addLog('必须先攻击护卫随从！', 'system');
            return;
        }

        const damage = attacker.attack;
        targetState.heroHp -= damage;
        addLog(`${attacker.name} 攻击${targetSide === 'enemy' ? '敌方' : '我方'}主公，造成 ${damage} 点伤害！`, 'attack');

        attacker.canAttack = false;

        // Animate attack on hero
        animateAttack(attackerSide, attackerIdx, targetSide, -1, true, damage, 0);

        setTimeout(() => {
            selectedAttacker = null;
            renderAll();
            checkGameOver();
        }, 600);
    }
}

function processDeaths() {
    // Loop until no more deaths (handles deathrattle chain kills)
    let hadDeaths = true;
    while (hadDeaths) {
        hadDeaths = false;
        ['player', 'enemy'].forEach(side => {
            const board = gameState[side].board;
            for (let i = board.length - 1; i >= 0; i--) {
                if (board[i].currentHp <= 0) {
                    hadDeaths = true;
                    const dead = board[i];
                    addLog(`${dead.name} 阵亡！`, 'critical');

                    // Death flash effect on sprite
                    const sprites = boardSprites[side];
                    const sprite = sprites[i];
                    if (sprite && sprite.parent) {
                        // Brief red flash before removal
                        const flash = new PIXI.Graphics();
                        flash.beginFill(0xff0000, 0.6);
                        flash.drawRoundedRect(-40, -50, 80, 100, 10);
                        flash.endFill();
                        sprite.addChild(flash);
                        gsap.to(flash, { alpha: 0, duration: 0.4, onComplete: () => {
                            if (flash.parent) flash.parent.removeChild(flash);
                        }});
                    }

                    // Show toast for deaths
                    showToast(`${dead.name} 阵亡！`);

                    // Trigger deathrattle
                    if (dead.keywords.includes('deathrattle') && dead.deathrattleFn) {
                        triggerDeathrattle(dead, side);
                    }

                    board.splice(i, 1);
                }
            }
        });
    }
}

function endTurn() {
    if (!gameState.isPlayerTurn || gameState.battleEnded || animating) return;

    selectedAttacker = null;
    document.getElementById('btnEndTurn').disabled = true;

    // Disable player minion attacks
    gameState.player.board.forEach(m => m.canAttack = false);

    renderAll();

    // Start enemy turn
    setTimeout(() => startTurn('enemy'), 400);
}

function checkGameOver() {
    if (gameState.player.heroHp <= 0) {
        gameState.battleEnded = true;
        addLog('我方主公阵亡...战败！', 'critical');
        setTimeout(() => showBattleResult(false), 800);
        return true;
    }
    if (gameState.enemy.heroHp <= 0) {
        gameState.battleEnded = true;
        addLog('敌方主公阵亡！胜利！', 'info');
        setTimeout(() => showBattleResult(true), 800);
        return true;
    }
    return false;
}

// ====== Battlecry & Deathrattle Effects ======
function triggerBattlecry(card, side) {
    const fn = card.battlecryFn;
    const oppSide = side === 'player' ? 'enemy' : 'player';
    switch (fn) {
        case 'draw1':
            drawCard(side);
            addLog(`${card.name} 登场效果：抓1张牌`, 'skill');
            break;
        case 'draw2':
            drawCard(side); drawCard(side);
            addLog(`${card.name} 登场效果：抓2张牌`, 'skill');
            break;
        case 'draw3':
            drawCard(side); drawCard(side); drawCard(side);
            addLog(`${card.name} 登场效果：抓3张牌`, 'skill');
            break;
        case 'damage1':
            dealRandomDamage(oppSide, 1, card.name);
            break;
        case 'damage2':
            dealRandomDamage(oppSide, 2, card.name);
            break;
        case 'damage3':
            dealRandomDamage(oppSide, 3, card.name);
            break;
        case 'healHero2':
            gameState[side].heroHp = Math.min(gameState[side].maxHeroHp, gameState[side].heroHp + 2);
            addLog(`${card.name} 登场效果：治疗主公2点`, 'skill');
            break;
        case 'healHero3':
            gameState[side].heroHp = Math.min(gameState[side].maxHeroHp, gameState[side].heroHp + 3);
            addLog(`${card.name} 登场效果：治疗主公3点`, 'skill');
            break;
        case 'healHero4':
            gameState[side].heroHp = Math.min(gameState[side].maxHeroHp, gameState[side].heroHp + 4);
            addLog(`${card.name} 登场效果：治疗主公4点`, 'skill');
            break;
        case 'aoe2':
            aoeMinions(oppSide, 2, card.name);
            break;
        case 'aoe3':
            aoeMinions(oppSide, 3, card.name);
            break;
    }
}

function triggerDeathrattle(card, side) {
    const fn = card.deathrattleFn;
    const oppSide = side === 'player' ? 'enemy' : 'player';
    switch (fn) {
        case 'draw2':
            drawCard(side); drawCard(side);
            addLog(`${card.name} 遗计：抓2张牌`, 'skill');
            break;
        case 'aoe3enemy':
            aoeMinions(oppSide, 3, card.name + '(遗计)');
            break;
        case 'aoe3all':
            aoeMinions('player', 3, card.name + '(遗计)');
            aoeMinions('enemy', 3, card.name + '(遗计)');
            addLog(`${card.name} 遗计：对全体造成3伤害`, 'critical');
            break;
        case 'damageHero2':
            gameState[oppSide].heroHp -= 2;
            addLog(`${card.name} 遗计：对敌方主公造成2伤害`, 'skill');
            break;
    }
}

function dealRandomDamage(targetSide, damage, sourceName) {
    const board = gameState[targetSide].board;
    if (board.length > 0) {
        const target = board[Math.floor(Math.random() * board.length)];
        target.currentHp -= damage;
        addLog(`${sourceName} 登场效果：对 ${target.name} 造成${damage}点伤害`, 'skill');
    } else {
        // Hit hero
        gameState[targetSide].heroHp -= damage;
        addLog(`${sourceName} 登场效果：对${targetSide === 'enemy' ? '敌方' : '我方'}主公造成${damage}伤害`, 'skill');
    }
}

function aoeMinions(targetSide, damage, sourceName) {
    const board = gameState[targetSide].board;
    board.forEach(m => { m.currentHp -= damage; });
    addLog(`${sourceName} 对${targetSide === 'enemy' ? '敌方' : '我方'}全体随从造成${damage}伤害`, 'critical');
}

function isWeatherFogActive() { return currentWeather === 'fog'; }
function isWeatherSnowActive() { return currentWeather === 'snow'; }

// ====== Interaction System ======
function onHandCardClick(handIndex) {
    if (dragState.isDragThresholdMet) return; // Prevent click after drag
    if (!gameState.isPlayerTurn || gameState.battleEnded || animating) return;
    selectedAttacker = null;
    playCard(handIndex);
}

function onBoardMinionClick(card, isEnemy) {
    if (gameState.battleEnded || animating) return;

    if (!isEnemy && gameState.isPlayerTurn) {
        // Select our minion as attacker
        if (!card.canAttack || card.hasSummonSickness) {
            if (card.hasSummonSickness) {
                addLog(`${card.name} 刚上场，不能攻击`, 'system');
            } else {
                addLog(`${card.name} 本回合已攻击过`, 'system');
            }
            return;
        }
        const idx = gameState.player.board.indexOf(card);
        if (selectedAttacker && selectedAttacker.side === 'player' && selectedAttacker.index === idx) {
            // Deselect
            selectedAttacker = null;
            renderAll();
            return;
        }
        selectedAttacker = { side: 'player', index: idx };
        // Update visual state
        boardSprites.player.forEach((s, i) => {
            setBoardMinionState(s, i === idx ? 'selected' : 'idle');
        });
        boardSprites.enemy.forEach(s => {
            setBoardMinionState(s, 'targetable');
        });
        // Highlight enemy hero badge as targetable
        updateHeroPortraitTargetable(true);
    } else if (isEnemy && gameState.isPlayerTurn && selectedAttacker) {
        // Attack enemy minion
        const targetIdx = gameState.enemy.board.indexOf(card);
        if (targetIdx < 0) {
            console.warn('[Click] enemy card not found in board', card.name);
            return;
        }
        performAttack(selectedAttacker.side, selectedAttacker.index, 'enemy', targetIdx, false);
    } else if (isEnemy && gameState.isPlayerTurn && !selectedAttacker) {
        addLog('请先选择我方随从再攻击', 'system');
    }
}

function onHeroClick(side) {
    if (gameState.battleEnded || animating) return;

    if (side === 'enemy' && gameState.isPlayerTurn && selectedAttacker) {
        performAttack(selectedAttacker.side, selectedAttacker.index, 'enemy', -1, true);
    } else if (side === 'enemy' && gameState.isPlayerTurn && !selectedAttacker) {
        addLog('请先选择我方随从再攻击', 'system');
    }
}

// ====== Drag-to-Play System ======
function getPointerPos(e) {
    if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
}

function onDragPointerDown(e, cardIndex, cardEl) {
    if (!gameState.isPlayerTurn || gameState.battleEnded || animating) return;
    // Only left mouse button or touch
    if (e.type === 'mousedown' && e.button !== 0) return;

    const pos = getPointerPos(e);
    dragState.cardIndex = cardIndex;
    dragState.sourceEl = cardEl;
    dragState.startX = pos.x;
    dragState.startY = pos.y;
    dragState.isDragThresholdMet = false;
    dragState.active = false;

    // Bind move/up listeners
    document.addEventListener('mousemove', onDragPointerMove);
    document.addEventListener('mouseup', onDragPointerUp);
    document.addEventListener('touchmove', onDragPointerMove, { passive: false });
    document.addEventListener('touchend', onDragPointerUp);
    document.addEventListener('touchcancel', onDragPointerUp);
}

function onDragPointerMove(e) {
    const pos = getPointerPos(e);
    const dx = pos.x - dragState.startX;
    const dy = pos.y - dragState.startY;

    if (!dragState.isDragThresholdMet) {
        if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
            dragState.isDragThresholdMet = true;
            startDrag(pos);
        }
        return;
    }

    e.preventDefault();

    // Move ghost
    if (dragState.ghost) {
        dragState.ghost.style.left = (pos.x - 38) + 'px';
        dragState.ghost.style.top = (pos.y - 52) + 'px';
    }

    updateDropZoneVisual(pos);
}

function startDrag(pos) {
    dragState.active = true;

    // Mark source card
    if (dragState.sourceEl) {
        dragState.sourceEl.classList.add('dragging-source');
    }

    // Add dragging class to hand row
    document.getElementById('handRow').classList.add('dragging');

    // Create ghost element (clone of card)
    const card = gameState.player.hand[dragState.cardIndex];
    if (!card) { cleanupDrag(); return; }

    const canPlay = card.cost <= gameState.player.mana && gameState.player.board.length < 10;
    const ghostArt = getCardArtHtml(card);

    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost' + (canPlay ? '' : ' unplayable');
    ghost.innerHTML = `
        <span class="card-cost">${card.cost}</span>
        <div class="card-art">${ghostArt}</div>
        <div class="card-name">${card.name}</div>
        <div class="card-stats">
            <span class="card-atk">⚔${card.attack}</span>
            <span class="card-hp">♥${card.hp}</span>
        </div>
    `;
    ghost.style.left = (pos.x - 38) + 'px';
    ghost.style.top = (pos.y - 52) + 'px';
    document.body.appendChild(ghost);
    dragState.ghost = ghost;

    // Show drop zone
    const indicator = document.getElementById('dropZoneIndicator');
    indicator.classList.add('show');
}

function updateDropZoneVisual(pos) {
    const indicator = document.getElementById('dropZoneIndicator');
    if (isInDropZone(pos)) {
        indicator.classList.add('hover');
    } else {
        indicator.classList.remove('hover');
    }
}

function isInDropZone(pos) {
    // Drop zone: upper portion of screen (above the bottom panel)
    const bottomPanel = document.getElementById('bottomPanel');
    const bottomTop = bottomPanel.getBoundingClientRect().top;
    // Card must be dragged above the bottom panel area
    return pos.y < bottomTop - 20;
}

function onDragPointerUp(e) {
    // Remove listeners
    document.removeEventListener('mousemove', onDragPointerMove);
    document.removeEventListener('mouseup', onDragPointerUp);
    document.removeEventListener('touchmove', onDragPointerMove);
    document.removeEventListener('touchend', onDragPointerUp);
    document.removeEventListener('touchcancel', onDragPointerUp);

    if (!dragState.isDragThresholdMet) {
        // No drag happened, let click handle it
        resetDragState();
        return;
    }

    const pos = e.changedTouches ? { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY } : { x: e.clientX, y: e.clientY };
    const card = gameState.player.hand[dragState.cardIndex];
    const canPlay = card && card.cost <= gameState.player.mana && gameState.player.board.length < 10 && !gameState.battleEnded && !animating;

    if (isInDropZone(pos) && canPlay) {
        // Play the card with a fly-in animation
        const ghost = dragState.ghost;
        const idx = dragState.cardIndex;
        if (ghost) {
            // Animate ghost to center of player zone then play
            const targetY = window.innerHeight * 0.45;
            const targetX = window.innerWidth / 2 - 38;
            ghost.style.transition = 'left 0.2s ease, top 0.2s ease, opacity 0.2s ease, transform 0.2s ease';
            ghost.style.left = targetX + 'px';
            ghost.style.top = targetY + 'px';
            ghost.style.opacity = '0';
            ghost.style.transform = 'scale(0.5)';
            setTimeout(() => {
                cleanupDrag();
                selectedAttacker = null;
                playCard(idx);
            }, 200);
        } else {
            cleanupDrag();
            selectedAttacker = null;
            playCard(idx);
        }
    } else {
        // Snap back
        snapBack();
    }
}

function snapBack() {
    const ghost = dragState.ghost;
    if (ghost && dragState.sourceEl) {
        const rect = dragState.sourceEl.getBoundingClientRect();
        ghost.style.transition = 'left 0.25s ease, top 0.25s ease, opacity 0.25s ease';
        ghost.style.left = rect.left + 'px';
        ghost.style.top = rect.top + 'px';
        ghost.style.opacity = '0.5';
        setTimeout(() => cleanupDrag(), 250);
    } else {
        cleanupDrag();
    }
}

function cleanupDrag() {
    // Remove ghost
    if (dragState.ghost && dragState.ghost.parentNode) {
        dragState.ghost.parentNode.removeChild(dragState.ghost);
    }

    // Remove source highlight
    if (dragState.sourceEl) {
        dragState.sourceEl.classList.remove('dragging-source');
    }

    // Hide drop zone
    const indicator = document.getElementById('dropZoneIndicator');
    indicator.classList.remove('show', 'hover');

    // Remove dragging class
    document.getElementById('handRow').classList.remove('dragging');

    const wasDrag = dragState.isDragThresholdMet;
    dragState.active = false;
    dragState.ghost = null;
    dragState.sourceEl = null;
    dragState.cardIndex = -1;

    // Re-render hand cards now that drag is over
    if (gameState) renderHandCards();

    // Keep isDragThresholdMet true briefly to suppress the click event
    if (wasDrag) {
        setTimeout(() => { dragState.isDragThresholdMet = false; }, 50);
    }
}

function resetDragState() {
    dragState.active = false;
    dragState.ghost = null;
    dragState.sourceEl = null;
    dragState.cardIndex = -1;
    dragState.isDragThresholdMet = false;
}

// ====== Enemy AI ======
function enemyAI() {
    if (gameState.battleEnded || gameState.isPlayerTurn) return;

    const actions = [];
    const s = gameState.enemy;

    // Phase 1: Play cards (greedy, highest cost first)
    const playable = s.hand
        .map((c, i) => ({ card: c, idx: i }))
        .filter(x => x.card.cost <= s.mana && s.board.length < 10)
        .sort((a, b) => b.card.cost - a.card.cost);

    let manaLeft = s.mana;
    let boardCount = s.board.length;
    const toPlay = [];
    for (const p of playable) {
        if (p.card.cost <= manaLeft && boardCount < 10) {
            toPlay.push(p);
            manaLeft -= p.card.cost;
            boardCount++;
        }
    }

    // Phase 2: Attack with minions
    // Build attack sequence after playing cards
    const executeAI = (step) => {
        if (gameState.battleEnded) return;

        if (step < toPlay.length) {
            // Play a card
            const cardInfo = toPlay[step];
            const currentIdx = s.hand.indexOf(cardInfo.card);
            if (currentIdx >= 0) {
                aiPlayCard(currentIdx);
            }
            setTimeout(() => executeAI(step + 1), 600);
        } else {
            // Attack phase
            setTimeout(() => aiAttackPhase(), 400);
        }
    };

    if (toPlay.length > 0 || s.board.length > 0) {
        executeAI(0);
    } else {
        // No actions, end turn
        setTimeout(() => aiEndTurn(), 400);
    }
}

function aiPlayCard(handIndex) {
    const s = gameState.enemy;
    if (handIndex < 0 || handIndex >= s.hand.length) return;
    const card = s.hand[handIndex];
    if (card.cost > s.mana || s.board.length >= 10) return;

    s.mana -= card.cost;
    s.hand.splice(handIndex, 1);

    card.currentHp = card.hp;
    card.maxHp = card.hp;
    card.canAttack = false;
    card.hasSummonSickness = true;

    if (card.keywords.includes('charge') && !isWeatherSnowActive()) {
        card.canAttack = true;
        card.hasSummonSickness = false;
    }

    s.board.push(card);
    addLog(`敌方出牌：${card.name} (${card.cost}费 ${card.attack}/${card.hp})`, 'attack');

    if (card.keywords.includes('battlecry') && card.battlecryFn) {
        triggerBattlecry(card, 'enemy');
        processDeaths();
    }

    renderAll();
    checkGameOver();
}

function aiAttackPhase() {
    if (gameState.battleEnded) return;

    const attackers = gameState.enemy.board.filter(m => m.canAttack && !m.hasSummonSickness);
    if (attackers.length === 0) {
        aiEndTurn();
        return;
    }

    let atkIndex = 0;
    const doAttack = () => {
        if (atkIndex >= attackers.length || gameState.battleEnded) {
            aiEndTurn();
            return;
        }

        const attacker = attackers[atkIndex];
        const atkBoardIdx = gameState.enemy.board.indexOf(attacker);
        if (atkBoardIdx < 0 || !attacker.canAttack) {
            atkIndex++;
            doAttack();
            return;
        }

        const playerBoard = gameState.player.board;
        const hasTaunters = playerBoard.filter(m => m.keywords.includes('taunt') && !isWeatherFogActive());

        let target = null;
        let targetIdx = -1;
        let hitHero = false;

        if (hasTaunters.length > 0) {
            // Must attack taunters
            target = hasTaunters[Math.floor(Math.random() * hasTaunters.length)];
            targetIdx = playerBoard.indexOf(target);
        } else {
            // Look for favorable trades
            let bestTrade = null;
            playerBoard.forEach((m, i) => {
                // Can we kill it and survive?
                if (m.currentHp <= attacker.attack && attacker.currentHp > m.attack) {
                    if (!bestTrade || m.attack > bestTrade.card.attack) {
                        bestTrade = { card: m, idx: i };
                    }
                }
            });

            if (bestTrade) {
                target = bestTrade.card;
                targetIdx = bestTrade.idx;
            } else if (playerBoard.length === 0 || Math.random() < 0.6) {
                // Go face
                hitHero = true;
            } else {
                // Hit a random minion
                targetIdx = Math.floor(Math.random() * playerBoard.length);
                target = playerBoard[targetIdx];
            }
        }

        if (hitHero) {
            // Attack player hero
            const damage = attacker.attack;
            gameState.player.heroHp -= damage;
            addLog(`${attacker.name} 攻击我方主公，造成 ${damage} 伤害！`, 'attack');
            attacker.canAttack = false;

            animateAttack('enemy', atkBoardIdx, 'player', -1, true, damage, 0);

            setTimeout(() => {
                renderAll();
                if (!checkGameOver()) {
                    atkIndex++;
                    setTimeout(doAttack, 500);
                }
            }, 600);
        } else if (target) {
            // Attack minion
            const atkMultiplier = getCounterMultiplier(attacker, target);
            const defMultiplier = getCounterMultiplier(target, attacker);
            const atkDamage = Math.max(1, Math.floor(attacker.attack * atkMultiplier));
            const defDamage = Math.max(1, Math.floor(target.attack * defMultiplier));

            target.currentHp -= atkDamage;
            attacker.currentHp -= defDamage;
            attacker.canAttack = false;

            addLog(`${attacker.name}(${atkDamage}伤) ⚔ ${target.name}(${defDamage}伤)`, 'attack');

            animateAttack('enemy', atkBoardIdx, 'player', targetIdx, false, atkDamage, defDamage);

            setTimeout(() => {
                processDeaths();
                setTimeout(() => {
                    renderAll();
                    if (!checkGameOver()) {
                        atkIndex++;
                        setTimeout(doAttack, 500);
                    }
                }, 300);
            }, 600);
        } else {
            atkIndex++;
            doAttack();
        }
    };

    doAttack();
}

function getCounterMultiplier(attacker, target) {
    const at = UnitType[attacker.unitType];
    const tt = UnitType[target.unitType];
    let multiplier = 1.0;
    if (at && tt && at.counters === target.unitType) {
        multiplier = 1.3;
    } else if (at && tt && at.weakness === target.unitType) {
        multiplier = 0.8;
    }
    if (currentWeather === 'wind' && attacker.unitType === 'ARCHER') {
        multiplier *= 1.3;
    }
    return multiplier;
}

function aiEndTurn() {
    if (gameState.battleEnded) return;
    gameState.enemy.board.forEach(m => m.canAttack = false);
    renderAll();
    setTimeout(() => startTurn('player'), 400);
}

// ====== Animations ======
function animateAttack(attackerSide, attackerIdx, targetSide, targetIdx, isHero, atkDamage, defDamage) {
    const attackerSprites = boardSprites[attackerSide];
    const targetSprites = boardSprites[targetSide];
    const attackerSprite = attackerSprites[attackerIdx];
    if (!attackerSprite) return;

    animating = true;

    let targetPos;
    if (isHero) {
        // Target is hero - compute hero global position
        if (targetSide === 'enemy') {
            targetPos = { x: app.screen.width / 2, y: 70 };
        } else {
            targetPos = { x: app.screen.width / 2, y: app.screen.height - 50 };
        }
    } else {
        const targetSprite = targetSprites[targetIdx];
        if (!targetSprite) { animating = false; return; }
        targetPos = targetSprite.parent.toGlobal(targetSprite.position);
    }

    const origX = attackerSprite.position.x;
    const origY = attackerSprite.position.y;
    const attackerGlobal = attackerSprite.parent.toGlobal(attackerSprite.position);
    const dx = (targetPos.x - attackerGlobal.x) * 0.3;
    const dy = (targetPos.y - attackerGlobal.y) * 0.3;
    const localDx = dx / (attackerSprite.parent.scale?.x || 1);
    const localDy = dy / (attackerSprite.parent.scale?.y || 1);

    gsap.timeline()
        .to(attackerSprite, { x: origX + localDx, y: origY + localDy, duration: 0.15, ease: 'power2.in' })
        .to(attackerSprite, { x: origX, y: origY, duration: 0.25, ease: 'back.out(2)' })
        .call(() => {
            try {
                // Show damage numbers and update HP visuals immediately
                if (!isHero) {
                    const targetSprite = targetSprites[targetIdx];
                    // Update HP text on sprites immediately so damage is visible
                    const targetCard = gameState[targetSide]?.board[targetIdx];
                    const attackerCard = gameState[attackerSide]?.board[attackerIdx];
                    if (targetSprite && targetSprite.parent) {
                        if (targetCard) updateMinionVisual(targetSprite, targetCard);
                        showDamageNumber(targetSprite, atkDamage, false);
                        // Shake target
                        gsap.to(targetSprite, { x: targetSprite.position.x + 8, duration: 0.05, repeat: 5, yoyo: true, onComplete: () => {
                            targetSprite.x = targetSprite.originalX || 0;
                        }});
                    }
                    if (attackerSprite && attackerSprite.parent) {
                        if (attackerCard) updateMinionVisual(attackerSprite, attackerCard);
                        showDamageNumber(attackerSprite, defDamage, false);
                    }
                } else {
                    // Hero damage flash on portrait
                    const portraitId = targetSide === 'player' ? 'playerHeroPortrait' : 'enemyHeroPortrait';
                    const hpCircleId = targetSide === 'player' ? 'playerHpCircle' : 'enemyHpCircle';
                    const portrait = document.getElementById(portraitId);
                    const hpCircle = document.getElementById(hpCircleId);
                    portrait.style.transform = 'scale(1.15)';
                    portrait.style.boxShadow = '0 0 25px 8px rgba(255,0,0,0.8)';
                    hpCircle.style.transform = 'scale(1.3)';
                    hpCircle.style.background = 'linear-gradient(135deg, #ff0000, #cc0000)';
                    setTimeout(() => {
                        portrait.style.transform = '';
                        portrait.style.boxShadow = '';
                        hpCircle.style.transform = '';
                        hpCircle.style.background = '';
                    }, 400);
                    // Update hero HP
                    renderHeroAreas();
                }
            } finally {
                animating = false;
            }
        });
}

function animateCardPlay() {
    // Simple flash effect for now
}

function showDamageNumber(sprite, damage, isCritical) {
    if (!damage || damage <= 0) return;
    if (!sprite || !sprite.parent) return;
    const globalPos = sprite.parent.toGlobal(sprite.position);
    const style = {
        fontSize: isCritical ? 36 : 24,
        fill: isCritical ? 0xFFD700 : 0xff6b6b,
        fontWeight: 'bold',
        stroke: 0x000000,
        strokeThickness: 4
    };
    const dmgText = new PIXI.Text('-' + damage, style);
    dmgText.anchor.set(0.5);
    dmgText.position.set(globalPos.x + (Math.random() - 0.5) * 20, globalPos.y - 20);
    layers.effects.addChild(dmgText);

    gsap.to(dmgText, { y: dmgText.y - 60, alpha: 0, duration: 1.0, ease: 'power2.out', onComplete: () => {
        layers.effects.removeChild(dmgText);
        dmgText.destroy();
    }});
    gsap.fromTo(dmgText.scale, { x: 0.5, y: 0.5 }, { x: 1.2, y: 1.2, duration: 0.15, ease: 'back.out(2)', onComplete: () => {
        gsap.to(dmgText.scale, { x: 1, y: 1, duration: 0.2 });
    }});
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast-msg';
    toast.textContent = msg;
    document.getElementById('game-container').appendChild(toast);
    setTimeout(() => toast.remove(), 2200);
}

// ====== UI Rendering (DOM) ======
function renderAll() {
    if (!gameState) return;
    renderBoard();
    renderHandCards();
    renderEnemyHand();
    renderTopBar();
    renderHeroAreas();
    renderBottomInfo();
}

function renderHandCards() {
    // Guard: don't rebuild during drag
    if (dragState.active) return;

    const handRow = document.getElementById('handRow');
    // Remove old cards but keep deck icon
    const deckIcon = document.getElementById('playerDeckIcon');
    handRow.innerHTML = '';
    handRow.appendChild(deckIcon);

    // Update deck count
    deckIcon.textContent = gameState.player.deck.length;

    gameState.player.hand.forEach((card, idx) => {
        const el = document.createElement('div');
        const canPlay = gameState.isPlayerTurn && card.cost <= gameState.player.mana && gameState.player.board.length < 10 && !gameState.battleEnded && !animating;
        el.className = 'hand-card ' + (canPlay ? 'playable' : 'unplayable');
        el.onclick = () => onHandCardClick(idx);

        // Drag listeners
        el.addEventListener('mousedown', (e) => onDragPointerDown(e, idx, el));
        el.addEventListener('touchstart', (e) => onDragPointerDown(e, idx, el), { passive: false });

        const keywordText = [];
        if (card.keywords.includes('taunt')) keywordText.push('护卫');
        if (card.keywords.includes('charge')) keywordText.push('突击');
        if (card.keywords.includes('battlecry')) keywordText.push('登场');
        if (card.keywords.includes('deathrattle')) keywordText.push('遗计');

        const factionLabel = FACTION_COLORS[card.faction]?.label || '?';
        const cardArt = getCardArtHtml(card);

        el.innerHTML = `
            <span class="card-cost">${card.cost}</span>
            <div class="card-art">${cardArt}</div>
            <div class="card-name">${card.name}</div>
            ${keywordText.length ? `<div class="card-keywords">${keywordText.join(' ')}</div>` : ''}
            <div class="card-stats">
                <span class="card-atk">⚔${card.attack}</span>
                <span class="card-hp">♥${card.hp}</span>
            </div>
            <div class="card-desc">
                <strong>${card.name}</strong> [${factionLabel}]<br>
                ${card.cost}费 ${card.attack}攻/${card.hp}血<br>
                ${card.desc || '无特殊效果'}
            </div>
        `;
        handRow.appendChild(el);
    });
}

function renderEnemyHand() {
    const area = document.getElementById('enemyHandArea');
    area.innerHTML = '';
    for (let i = 0; i < gameState.enemy.hand.length; i++) {
        const back = document.createElement('div');
        back.className = 'enemy-card-back';
        back.textContent = '🂠';
        area.appendChild(back);
    }
}

function renderTopBar() {
    // Enemy deck count in top bar
    document.getElementById('enemyDeckBadge').textContent = `敌牌库 ${gameState.enemy.deck.length}`;
}

function renderHeroAreas() {
    // Enemy hero
    document.getElementById('enemyHpCircle').textContent = Math.max(0, gameState.enemy.heroHp);
    document.getElementById('enemyManaCircle').textContent = `${gameState.enemy.mana}`;

    // Player hero
    document.getElementById('playerHpCircle').textContent = Math.max(0, gameState.player.heroHp);
    document.getElementById('playerManaCircle').textContent = `${gameState.player.mana}`;
}

function renderBottomInfo() {
    // Mana crystals
    const crystals = document.getElementById('manaCrystals');
    crystals.innerHTML = '';
    for (let i = 0; i < gameState.player.maxMana; i++) {
        const gem = document.createElement('div');
        gem.className = 'mana-gem ' + (i < gameState.player.mana ? 'filled' : 'empty');
        crystals.appendChild(gem);
    }

    // Mana text
    document.getElementById('playerManaBadge').textContent = `${gameState.player.mana}/${gameState.player.maxMana}`;

    // Player deck count
    document.getElementById('playerDeckBadge').textContent = `牌库 ${gameState.player.deck.length}`;
}

// ====== Weather Particle System ======
function cycleWeather() {
    weatherIndex = (weatherIndex + 1) % weatherOrder.length;
    currentWeather = weatherOrder[weatherIndex];
    updateWeatherDisplay();
    clearWeatherParticles();
    addLog(`天气变化：${WeatherTypes[currentWeather].name}（${WeatherTypes[currentWeather].effect}）`, 'skill');
    // Re-render board for taunt/charge changes due to weather
    if (gameState) renderAll();
}

function updateWeatherDisplay() {
    const w = WeatherTypes[currentWeather];
    document.getElementById('weatherBtn').textContent = w.icon;
    document.getElementById('weatherBtn').title = `${w.name}\n${w.effect}\n点击切换`;
}

function clearWeatherParticles() {
    weatherParticles.forEach(p => {
        layers.effects.removeChild(p);
        p.destroy();
    });
    weatherParticles = [];
}

function updateWeatherParticles() {
    if (!effectsEnabled) return;
    const maxParticles = 50;
    if (weatherParticles.length >= maxParticles) return;

    const w = app.screen.width;
    const h = app.screen.height;

    switch (currentWeather) {
        case 'sunny':
            if (Math.random() < 0.03 && weatherParticles.length < 20) {
                const sparkle = new PIXI.Graphics();
                sparkle.beginFill(0xFFD700, 0.6);
                sparkle.drawCircle(0, 0, 2 + Math.random() * 3);
                sparkle.endFill();
                sparkle.position.set(Math.random() * w, Math.random() * h * 0.4);
                layers.effects.addChild(sparkle);
                weatherParticles.push(sparkle);
                gsap.to(sparkle, { alpha: 0, duration: 2, onComplete: () => removeParticle(sparkle) });
            }
            break;
        case 'rain':
            if (Math.random() < 0.3) {
                const drop = new PIXI.Graphics();
                drop.beginFill(0x6699cc, 0.7);
                drop.drawRect(0, 0, 1.5, 12);
                drop.endFill();
                drop.position.set(Math.random() * w, -20);
                drop.vy = 8 + Math.random() * 4;
                layers.effects.addChild(drop);
                weatherParticles.push(drop);
            }
            break;
        case 'snow':
            if (Math.random() < 0.08) {
                const flake = new PIXI.Graphics();
                flake.beginFill(0xffffff, 0.8);
                flake.drawCircle(0, 0, 2 + Math.random() * 3);
                flake.endFill();
                flake.position.set(Math.random() * w, -10);
                flake.vy = 1 + Math.random() * 2;
                flake.vx = (Math.random() - 0.5) * 1;
                flake.rot = (Math.random() - 0.5) * 0.02;
                layers.effects.addChild(flake);
                weatherParticles.push(flake);
            }
            break;
        case 'fog':
            if (Math.random() < 0.01 && weatherParticles.length < 8) {
                const fog = new PIXI.Graphics();
                fog.beginFill(0xcccccc, 0.12);
                fog.drawCircle(0, 0, 60 + Math.random() * 80);
                fog.endFill();
                fog.position.set(-100, Math.random() * h);
                fog.vx = 0.5 + Math.random() * 0.5;
                layers.effects.addChild(fog);
                weatherParticles.push(fog);
            }
            break;
        case 'wind':
            if (Math.random() < 0.15) {
                const line = new PIXI.Graphics();
                line.lineStyle(1, 0xaaaaaa, 0.5);
                line.moveTo(0, 0);
                line.lineTo(30 + Math.random() * 40, 0);
                line.position.set(-50, Math.random() * h);
                line.vx = 10 + Math.random() * 8;
                layers.effects.addChild(line);
                weatherParticles.push(line);
            }
            break;
    }

    // Move particles
    for (let i = weatherParticles.length - 1; i >= 0; i--) {
        const p = weatherParticles[i];
        if (p.vy) p.y += p.vy;
        if (p.vx) p.x += p.vx;
        if (p.rot) p.rotation += p.rot;
        if (p.y > h + 20 || p.x > w + 150) {
            removeParticle(p);
        }
    }
}

function removeParticle(p) {
    const idx = weatherParticles.indexOf(p);
    if (idx !== -1) weatherParticles.splice(idx, 1);
    if (p.parent) p.parent.removeChild(p);
    p.destroy();
}

// ====== Battle Log ======
function addLog(msg, type = 'system') {
    logEntries.push({ msg, type });
    if (logEntries.length > 50) logEntries.shift();

    const body = document.getElementById('battleLogBody');
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + type;
    entry.textContent = msg;
    body.appendChild(entry);
    body.scrollTop = body.scrollHeight;
}

function clearLog() {
    logEntries = [];
    document.getElementById('battleLogBody').innerHTML = '';
}

function toggleBattleLog() {
    const log = document.getElementById('battleLog');
    log.classList.toggle('collapsed');
    document.getElementById('logToggle').textContent = log.classList.contains('collapsed') ? '展开' : '折叠';
}

// ====== Effects Toggle ======
function toggleEffects() {
    effectsEnabled = !effectsEnabled;
    if (!effectsEnabled) {
        clearWeatherParticles();
        addLog('特效已关闭', 'system');
    } else {
        addLog('特效已开启', 'system');
    }
}

// ====== Side Menu ======
function toggleMenu() {
    const menu = document.getElementById('sideMenu');
    const overlay = document.getElementById('menuOverlay');
    if (menu.classList.contains('open')) {
        closeMenu();
    } else {
        menu.classList.add('open');
        overlay.classList.add('show');
    }
}
function closeMenu() {
    document.getElementById('sideMenu').classList.remove('open');
    document.getElementById('menuOverlay').classList.remove('show');
}

// ====== Battle Result & API ======
function showBattleResult(isWin) {
    const overlay = document.getElementById('battleResult');
    const title = document.getElementById('resultTitle');
    const stars = document.getElementById('resultStars');
    const rewards = document.getElementById('resultRewards');

    title.textContent = isWin ? '胜利！' : '战败...';
    title.className = 'result-title ' + (isWin ? 'win' : 'lose');

    if (isWin) {
        const starCount = calcStars();
        stars.textContent = '⭐'.repeat(starCount) + '☆'.repeat(3 - starCount);
        addLog(`战斗胜利！获得 ${starCount} 星`, 'info');
    } else {
        stars.textContent = '';
        addLog('战斗失败...', 'critical');
    }

    rewards.innerHTML = '';
    if (isWin) {
        const turn = gameState.turn;
        rewards.innerHTML = `
            <div class="result-reward-item">金币: +${200 + turn * 10}</div>
            <div class="result-reward-item">经验: +${100 + turn * 5}</div>
        `;
    }

    overlay.classList.add('show');

    if (!IS_DEMO && isWin) {
        submitBattleResult(isWin);
    }
}

function calcStars() {
    const hpRatio = gameState.player.heroHp / gameState.player.maxHeroHp;
    if (hpRatio >= 0.7) return 3;
    if (hpRatio >= 0.3) return 2;
    return 1;
}

function resetBattle() {
    document.getElementById('battleResult').classList.remove('show');
    selectedAttacker = null;
    animating = false;
    clearWeatherParticles();

    layers.playerZone.removeChildren();
    layers.enemyZone.removeChildren();
    layers.centerZone.removeChildren();
    boardSprites.player = [];
    boardSprites.enemy = [];

    if (IS_DEMO) {
        initGame();
    } else {
        loadStageData(STAGE_ID);
    }
    document.getElementById('turnBadge').textContent = '回合 1';
}

// ====== API Client ======
const APIClient = {
    async getStage(stageId) {
        try {
            const resp = await fetch(`/api/pve/stage/${stageId}`);
            if (!resp.ok) throw new Error('API error');
            return await resp.json();
        } catch (e) {
            console.warn('API unavailable, falling back to demo mode', e);
            return null;
        }
    },
    async getStamina() {
        try {
            const resp = await fetch('/api/pve/stamina');
            if (!resp.ok) throw new Error('API error');
            return await resp.json();
        } catch (e) {
            return null;
        }
    },
    async submitBattle(stageId, result, stars, turns) {
        try {
            const resp = await fetch('/api/pve/battle/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ stage_id: stageId, result, stars, turns })
            });
            if (!resp.ok) throw new Error('API error');
            return await resp.json();
        } catch (e) {
            console.warn('Failed to submit battle result', e);
            return null;
        }
    }
};

async function loadStageData(stageId) {
    const stageResp = await APIClient.getStage(stageId);
    if (!stageResp || !stageResp.success) {
        addLog('API不可用，使用Demo数据', 'system');
        initGame();
        return;
    }
    // For now, use demo deck in stage mode too
    addLog('关卡模式加载中...', 'system');
    initGame();
}

async function submitBattleResult(isWin) {
    if (!STAGE_ID) return;
    const result = await APIClient.submitBattle(STAGE_ID, isWin ? 'win' : 'lose', calcStars(), gameState.turn);
    if (result && result.success && result.rewards) {
        const rewardsDiv = document.getElementById('resultRewards');
        rewardsDiv.innerHTML = '';
        if (result.rewards.coins) {
            rewardsDiv.innerHTML += `<div class="result-reward-item">金币: +${result.rewards.coins}</div>`;
        }
        if (result.rewards.exp) {
            rewardsDiv.innerHTML += `<div class="result-reward-item">经验: +${result.rewards.exp}</div>`;
        }
        if (result.drops) {
            result.drops.forEach(d => {
                rewardsDiv.innerHTML += `<div class="result-reward-item">${d.item_type}: +${d.quantity}</div>`;
            });
        }
    }
}

// ====== Initialization ======
// Preload all card artwork images
function preloadCardArt() {
    const urls = Object.values(CARD_ART_MAP);
    if (urls.length === 0) return Promise.resolve();

    const loadingText = document.querySelector('.loading-text');
    let loaded = 0;

    return new Promise((resolve) => {
        let pending = urls.length;
        const onDone = () => {
            loaded++;
            if (loadingText) loadingText.textContent = `加载原画中... (${loaded}/${urls.length})`;
            pending--;
            if (pending <= 0) resolve();
        };

        urls.forEach(url => {
            // Preload for DOM (img cache)
            const img = new Image();
            img.onload = onDone;
            img.onerror = onDone; // Don't block on failed loads
            img.src = url;
        });

        // Timeout fallback: don't wait forever
        setTimeout(resolve, 8000);
    });
}

window.addEventListener('load', function() {
    if (typeof PIXI === 'undefined' || typeof gsap === 'undefined') {
        document.getElementById('loading').innerHTML = '<div class="loading-text" style="color:#ff4444">加载失败，请检查网络连接</div>';
        return;
    }

    try {
        initApp();
        updateWeatherDisplay();

        // Preload card art, then start game
        preloadCardArt().then(() => {
            // Also preload into PixiJS texture cache
            Object.values(CARD_ART_MAP).forEach(url => {
                try { PIXI.Texture.from(url); } catch(e) {}
            });

            if (IS_DEMO) {
                initGame();
            } else {
                loadStageData(STAGE_ID);
            }
        });
    } catch (error) {
        console.error('初始化失败:', error);
        document.getElementById('loading').innerHTML = '<div class="loading-text" style="color:#ff4444">初始化失败: ' + error.message + '</div>';
    }
});

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>三国战斗 - 炉石风格</title>
    <!-- PixiJS with fallback -->
    <script src="https://unpkg.com/pixi.js@7.3.2/dist/pixi.min.js"
            onerror="this.onerror=null; this.src='https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js'"></script>
    <!-- GSAP with fallback -->
    <script src="https://unpkg.com/gsap@3.12.2/dist/gsap.min.js"
            onerror="this.onerror=null; this.src='https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js'"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a14; font-family: 'Arial','Microsoft YaHei',sans-serif; color: #fff; touch-action: none; user-select: none; -webkit-user-select: none; }
        #game-container { width: 100%; height: 100%; position: relative; }
        #game-container canvas { display: block; }

        /* Loading */
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; z-index: 1000; }
        .loading-spinner { width: 50px; height: 50px; border: 4px solid rgba(255,215,0,0.3); border-top-color: #FFD700; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 16px; color: #FFD700; }

        /* Top Bar (simplified: turn + weather + FPS only) */
        .top-bar { position: absolute; top: 0; left: 0; right: 0; height: 40px; background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 100%); display: flex; align-items: center; justify-content: center; padding: 0 12px; z-index: 100; backdrop-filter: blur(5px); }
        .top-bar-left, .top-bar-center, .top-bar-right { display: flex; align-items: center; gap: 8px; }
        .top-bar-left { position: absolute; left: 12px; }
        .top-bar-right { position: absolute; right: 12px; }
        .turn-badge { background: linear-gradient(135deg, #b8944d, #d4af37); padding: 3px 14px; border-radius: 12px; font-size: 13px; font-weight: bold; }
        .weather-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 2px 8px; font-size: 16px; cursor: pointer; color: #fff; }
        .weather-btn:active { background: rgba(255,255,255,0.25); }
        .fps-badge { font-size: 11px; opacity: 0.6; }
        .deck-badge { font-size: 11px; color: #aaa; padding: 2px 6px; background: rgba(255,255,255,0.08); border-radius: 6px; }
        .mana-badge { font-size: 12px; color: #4facfe; padding: 2px 6px; background: rgba(79,172,254,0.15); border-radius: 6px; }

        /* ====== Hero Portrait Areas (Hearthstone-style) ====== */
        .hero-area { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 95; pointer-events: auto; }
        .enemy-hero-area { top: 52px; }
        .player-hero-area { bottom: 138px; }
        .hero-portrait { width: 72px; height: 72px; border-radius: 50%; overflow: hidden; border: 3px solid #8b7355; box-shadow: 0 0 15px rgba(0,0,0,0.6), inset 0 0 10px rgba(0,0,0,0.3); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
        .hero-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
        .hero-portrait::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); }
        .hero-portrait.enemy { border-color: #8b2020; box-shadow: 0 0 15px rgba(139,32,32,0.4), inset 0 0 10px rgba(0,0,0,0.3); }
        .hero-portrait.player { border-color: #2d6a4f; box-shadow: 0 0 15px rgba(45,106,79,0.4), inset 0 0 10px rgba(0,0,0,0.3); }
        .hero-portrait.targetable { box-shadow: 0 0 20px 6px rgba(255,60,60,0.7); transform: scale(1.12); border-color: #ff4444; }
        .hero-info { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .hero-hp-circle { width: 32px; height: 32px; background: linear-gradient(135deg, #cc2222, #991111); border: 2px solid #ff4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; color: #fff; text-shadow: 0 1px 3px #000; position: relative; margin-top: -10px; }
        .hero-hp-circle::before { content: ''; position: absolute; top: -1px; left: -1px; right: -1px; bottom: -1px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); }
        .hero-mana-circle { width: 28px; height: 28px; background: linear-gradient(135deg, #4facfe, #0077cc); border: 2px solid #66bbff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; text-shadow: 0 1px 3px #000; margin-top: -8px; }
        .hero-deck-count { font-size: 10px; color: #aaa; margin-top: 2px; }
        .hero-name-tag { font-size: 10px; color: #d4af37; font-weight: bold; margin-top: 2px; text-shadow: 0 1px 3px #000; }

        /* Enemy Hand (card backs) - shifted right to not overlap hero */
        .enemy-hand-area { position: absolute; top: 42px; left: 0; right: 0; height: 40px; display: flex; align-items: center; justify-content: center; gap: 3px; z-index: 90; pointer-events: none; }
        .enemy-card-back { width: 26px; height: 36px; background: linear-gradient(135deg, #3a2a1a, #5a3a2a); border: 1px solid #8b6914; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 11px; }

        /* Bottom Panel */
        .bottom-panel { position: absolute; bottom: 0; left: 0; right: 0; height: 130px; background: linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 80%, transparent 100%); z-index: 100; display: flex; flex-direction: column; padding: 0; backdrop-filter: blur(5px); }
        .hand-row { display: flex; align-items: flex-end; justify-content: center; flex: 1; padding: 0 60px; gap: 4px; position: relative; overflow: visible; }
        .info-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 12px 6px; }
        .info-row-left { display: flex; align-items: center; gap: 8px; }
        .info-row-right { display: flex; align-items: center; gap: 8px; }

        /* Hand Cards (DOM) */
        .hand-card { width: 76px; height: 105px; background: linear-gradient(135deg, #2a2a3e, #3a3a52); border: 2px solid #5a5a6f; border-radius: 8px; cursor: pointer; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; position: relative; overflow: hidden; flex-shrink: 0; }
        .hand-card:hover { transform: translateY(-30px) scale(1.3); z-index: 200; box-shadow: 0 8px 25px rgba(0,0,0,0.6); }
        .hand-card.playable { border-color: #28a745; box-shadow: 0 0 8px rgba(40,167,69,0.5); }
        .hand-card.unplayable { border-color: #555; opacity: 0.6; }
        .hand-card .card-cost { position: absolute; top: -2px; left: -2px; width: 22px; height: 22px; background: linear-gradient(135deg, #4facfe, #00a0ff); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; border: 2px solid #0077cc; z-index: 2; }
        .hand-card .card-art { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; border-radius: 6px; }
        .hand-card .card-art img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
        .hand-card .card-name { position: absolute; bottom: 18px; left: 0; width: 100%; font-size: 9px; font-weight: bold; text-align: center; color: #fff; text-shadow: 0 0 4px #000, 0 0 4px #000; z-index: 1; background: linear-gradient(transparent, rgba(0,0,0,0.7)); padding: 4px 0 1px; }
        .hand-card .card-stats { position: absolute; bottom: 2px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 6px; z-index: 1; }
        .hand-card .card-atk { font-size: 12px; font-weight: bold; color: #ff6b6b; text-shadow: 0 0 3px #000, 0 0 3px #000; }
        .hand-card .card-hp { font-size: 12px; font-weight: bold; color: #69db7c; text-shadow: 0 0 3px #000, 0 0 3px #000; }
        .hand-card .card-keywords { position: absolute; bottom: 30px; left: 0; width: 100%; font-size: 7px; color: #ffd43b; text-align: center; z-index: 1; text-shadow: 0 0 3px #000; }
        .hand-card .card-desc { display: none; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.95); border: 1px solid #b8944d; border-radius: 8px; padding: 8px 10px; font-size: 11px; width: 160px; text-align: center; z-index: 300; pointer-events: none; white-space: normal; }
        .hand-card:hover .card-desc { display: block; }

        /* Deck icon */
        .deck-icon { width: 40px; height: 55px; background: linear-gradient(135deg, #3a2a1a, #5a3a2a); border: 2px solid #8b6914; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; color: #d4af37; position: absolute; left: 10px; bottom: 5px; cursor: default; }

        /* End Turn Button — right side, vertically centered */
        .btn-end-turn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; padding: 0; border: 2px solid #b8944d; border-radius: 50%; font-size: 11px; font-weight: bold; cursor: pointer; color: #fff; background: linear-gradient(135deg, #28a745, #20c997); box-shadow: 0 0 14px rgba(40,167,69,0.5); z-index: 101; transition: all 0.2s; line-height: 1.2; }
        .btn-end-turn:hover { box-shadow: 0 0 22px rgba(40,167,69,0.7); }
        .btn-end-turn:active { transform: translateY(-50%) scale(0.92); }
        .btn-end-turn:disabled { opacity: 0.4; cursor: not-allowed; background: linear-gradient(135deg, #555, #444); box-shadow: none; }

        /* Mana crystals */
        .mana-crystals { display: flex; gap: 2px; align-items: center; }
        .mana-gem { width: 14px; height: 14px; border-radius: 50%; transition: all 0.3s; }
        .mana-gem.filled { background: linear-gradient(135deg, #4facfe, #00f2fe); box-shadow: 0 0 6px rgba(79,172,254,0.6); }
        .mana-gem.empty { background: rgba(79,172,254,0.15); border: 1px solid rgba(79,172,254,0.3); }

        /* Battle Log */
        .battle-log { position: absolute; bottom: 135px; left: 8px; width: 300px; max-height: 160px; background: rgba(20,20,28,0.92); border: 1px solid rgba(184,148,77,0.3); border-radius: 10px; z-index: 100; overflow: hidden; transition: max-height 0.3s; }
        .battle-log.collapsed { max-height: 30px; }
        .battle-log-header { background: rgba(184,148,77,0.12); border-bottom: 1px solid rgba(184,148,77,0.2); padding: 5px 10px; font-size: 11px; font-weight: bold; color: #c9a961; cursor: pointer; display: flex; justify-content: space-between; }
        .battle-log-body { max-height: 120px; overflow-y: auto; padding: 5px 8px; font-size: 11px; }
        .battle-log-body::-webkit-scrollbar { width: 3px; }
        .battle-log-body::-webkit-scrollbar-thumb { background: rgba(184,148,77,0.3); border-radius: 3px; }
        .log-entry { margin-bottom: 3px; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.25); animation: logSlide 0.3s ease; line-height: 1.4; }
        @keyframes logSlide { from { transform: translateX(-15px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .log-entry.system { color: #aaa; }
        .log-entry.attack { color: #ffd43b; }
        .log-entry.critical { color: #ff6b6b; font-weight: bold; }
        .log-entry.skill { color: #a78bfa; }
        .log-entry.info { color: #69db7c; }

        /* Side Menu */
        .menu-btn { position: absolute; top: 8px; left: 8px; z-index: 200; width: 36px; height: 36px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; cursor: pointer; background: rgba(0,0,0,0.5); border-radius: 8px; }
        .menu-btn span { display: block; width: 20px; height: 2px; background: #FFD700; border-radius: 1px; transition: all 0.3s; }
        .side-menu { position: absolute; top: 0; left: -250px; width: 250px; height: 100%; background: rgba(0,0,0,0.95); z-index: 300; transition: left 0.3s ease; backdrop-filter: blur(15px); padding: 60px 15px 15px; overflow-y: auto; }
        .side-menu.open { left: 0; }
        .menu-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 299; display: none; }
        .menu-overlay.show { display: block; }
        .menu-item { padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.08); border-radius: 8px; border-left: 3px solid #FFD700; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .menu-item:active { background: rgba(255,255,255,0.15); transform: translateX(5px); }
        .menu-title { font-size: 18px; font-weight: bold; color: #FFD700; margin-bottom: 15px; }

        /* Battle Result Overlay */
        .battle-result-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 500; display: none; align-items: center; justify-content: center; }
        .battle-result-overlay.show { display: flex; }
        .result-panel { background: rgba(10,10,20,0.95); border: 2px solid rgba(184,148,77,0.5); border-radius: 20px; padding: 30px; text-align: center; max-width: 360px; width: 90%; backdrop-filter: blur(15px); }
        .result-title { font-size: 36px; font-weight: bold; margin-bottom: 10px; }
        .result-title.win { color: #FFD700; }
        .result-title.lose { color: #ff6b6b; }
        .result-stars { font-size: 32px; margin: 10px 0; }
        .result-rewards { text-align: left; margin: 15px 0; font-size: 13px; }
        .result-reward-item { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .result-buttons { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
        .result-btn { padding: 10px 24px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; color: #fff; }
        .result-btn.primary { background: linear-gradient(135deg, #d4af37, #b8944d); }
        .result-btn.secondary { background: rgba(255,255,255,0.15); }

        /* Fatigue / Burn toast */
        .toast-msg { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); background: rgba(200,50,50,0.9); padding: 6px 16px; border-radius: 8px; font-size: 13px; font-weight: bold; z-index: 400; animation: toastFade 2s forwards; pointer-events: none; }
        @keyframes toastFade { 0%{opacity:1;transform:translateX(-50%) translateY(0);} 70%{opacity:1;} 100%{opacity:0;transform:translateX(-50%) translateY(-30px);} }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .battle-log { width: calc(100% - 16px); bottom: 120px; }
            .battle-log.collapsed { max-height: 28px; }
            .hand-card { width: 58px; height: 82px; }
            .hand-card .card-cost { width: 17px; height: 17px; font-size: 9px; top: -2px; left: -2px; }
            .hand-card .card-name { font-size: 8px; bottom: 14px; }
            .hand-card .card-atk, .hand-card .card-hp { font-size: 10px; }
            .bottom-panel { height: 110px; }
            .top-bar { height: 36px; }
            .enemy-hand-area { top: 36px; height: 34px; }
            .enemy-card-back { width: 22px; height: 30px; font-size: 9px; }
            .mulligan-card { width: 100px; height: 140px; }
            .hero-portrait { width: 56px; height: 56px; }
            .hero-hp-circle { width: 26px; height: 26px; font-size: 12px; margin-top: -8px; }
            .hero-mana-circle { width: 22px; height: 22px; font-size: 10px; }
            .enemy-hero-area { top: 38px; }
            .player-hero-area { bottom: 118px; }
            .btn-end-turn { width: 44px; height: 44px; font-size: 10px; right: 4px; }
        }

        /* ====== Mulligan Overlay ====== */
        .mulligan-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 600; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); }
        .mulligan-overlay.show { display: flex; }
        .mulligan-title { font-size: 22px; font-weight: bold; color: #FFD700; margin-bottom: 8px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .mulligan-subtitle { font-size: 13px; color: #aaa; margin-bottom: 24px; }
        .mulligan-cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; padding: 0 16px; }
        .mulligan-card { width: 120px; height: 170px; background: linear-gradient(135deg, #2a2a3e, #3a3a52); border: 3px solid #5a5a6f; border-radius: 10px; cursor: pointer; position: relative; overflow: hidden; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; }
        .mulligan-card:hover { transform: translateY(-8px); box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .mulligan-card.selected { border-color: #ff4444; box-shadow: 0 0 15px rgba(255,68,68,0.5); }
        .mulligan-card.selected::after { content: '✕'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 48px; color: #ff4444; font-weight: bold; text-shadow: 0 0 10px rgba(255,0,0,0.8); pointer-events: none; z-index: 3; }
        .mulligan-card .mc-cost { position: absolute; top: -4px; left: -4px; width: 28px; height: 28px; background: linear-gradient(135deg, #4facfe, #00a0ff); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: bold; color: #fff; border: 2px solid #0077cc; z-index: 2; }
        .mulligan-card .mc-art { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; border-radius: 8px; }
        .mulligan-card .mc-art img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
        .mulligan-card .mc-name { position: absolute; bottom: 28px; left: 0; width: 100%; font-size: 12px; font-weight: bold; text-align: center; color: #fff; text-shadow: 0 0 4px #000, 0 0 4px #000; z-index: 1; background: linear-gradient(transparent, rgba(0,0,0,0.7)); padding: 6px 0 1px; }
        .mulligan-card .mc-desc { position: absolute; bottom: 16px; left: 0; width: 100%; font-size: 10px; color: #ddd; text-align: center; z-index: 1; text-shadow: 0 0 3px #000; }
        .mulligan-card .mc-stats { position: absolute; bottom: 2px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 10px; z-index: 1; }
        .mulligan-card .mc-atk { font-size: 13px; font-weight: bold; color: #ff6b6b; text-shadow: 0 0 3px #000, 0 0 3px #000; }
        .mulligan-card .mc-hp { font-size: 13px; font-weight: bold; color: #69db7c; text-shadow: 0 0 3px #000, 0 0 3px #000; }
        .mulligan-btn { margin-top: 24px; padding: 12px 40px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; color: #fff; background: linear-gradient(135deg, #d4af37, #b8944d); transition: transform 0.2s, box-shadow 0.2s; }
        .mulligan-btn:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(212,175,55,0.4); }
        .mulligan-btn:active { transform: scale(0.95); }

        /* ====== Drag-to-Play ====== */
        .hand-card.dragging-source { opacity: 0.35; transform: none !important; pointer-events: none; }
        .drag-ghost { position: fixed; z-index: 10000; pointer-events: none; width: 76px; height: 105px; background: linear-gradient(135deg, #2a2a3e, #3a3a52); border: 2px solid #28a745; border-radius: 8px; box-shadow: 0 8px 30px rgba(40,167,69,0.5); overflow: hidden; transform: scale(1.15); transition: none; }
        .drag-ghost .card-cost { position: absolute; top: -2px; left: -2px; width: 22px; height: 22px; background: linear-gradient(135deg, #4facfe, #00a0ff); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; border: 2px solid #0077cc; z-index: 2; }
        .drag-ghost .card-art { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; border-radius: 6px; }
        .drag-ghost .card-art img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
        .drag-ghost .card-name { position: absolute; bottom: 18px; left: 0; width: 100%; font-size: 9px; font-weight: bold; text-align: center; color: #fff; text-shadow: 0 0 4px #000, 0 0 4px #000; z-index: 1; }
        .drag-ghost .card-stats { position: absolute; bottom: 2px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 6px; z-index: 1; }
        .drag-ghost .card-atk { font-size: 11px; font-weight: bold; color: #ff6b6b; text-shadow: 0 0 3px #000, 0 0 3px #000; }
        .drag-ghost .card-hp { font-size: 11px; font-weight: bold; color: #69db7c; text-shadow: 0 0 3px #000, 0 0 3px #000; }
        .drag-ghost.unplayable { border-color: #ff4444; box-shadow: 0 8px 30px rgba(255,68,68,0.3); }
        .drop-zone-indicator { position: absolute; top: 0; left: 0; right: 0; bottom: 130px; z-index: 99; display: none; pointer-events: none; }
        .drop-zone-indicator.show { display: block; }
        .drop-zone-indicator .drop-zone-inner { position: absolute; left: 10%; right: 10%; top: 40%; height: 80px; border: 3px dashed rgba(40,167,69,0.6); border-radius: 16px; background: rgba(40,167,69,0.08); display: flex; align-items: center; justify-content: center; transition: border-color 0.2s, background 0.2s; }
        .drop-zone-indicator.hover .drop-zone-inner { border-color: rgba(40,167,69,0.9); background: rgba(40,167,69,0.15); }
        .drop-zone-label { font-size: 14px; color: rgba(40,167,69,0.7); font-weight: bold; }
        .hand-row.dragging { overflow: visible; }
    </style>
</head>
<body>
<div id="game-container">
    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载战场中...</div>
    </div>

    <!-- Menu Button -->
    <div class="menu-btn" id="menuBtn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>

    <!-- Side Menu -->
    <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div class="menu-title">战斗菜单</div>

let nextCardId = 1;
function buildDeck(cardDefs) {
    const deck = cardDefs.map(def => ({
        ...def,
        id: nextCardId++,
        currentHp: def.hp,
        maxHp: def.hp,
        baseAttack: def.attack,
        canAttack: false,
        hasSummonSickness: true,
    }));
    // Shuffle
    for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    return deck;
}

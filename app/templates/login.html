{% extends "base.html" %}

{% block title %}登录 - 成人卡牌游戏{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 500px; margin: 50px auto;">
        <h2 style="text-align: center; margin-bottom: 30px;">登录</h2>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" name="remember" value="1"> 记住我
                </label>
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">登录</button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            还没有账户？ <a href="{{ url_for('auth.register') }}" style="color: #667eea;">立即注册</a>
        </p>
    </div>
</div>
{% endblock %}

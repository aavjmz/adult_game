{% extends "base.html" %}

{% block title %}仪表盘 - 成人卡牌游戏{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h1 style="margin-bottom: 30px;">欢迎回来，{{ user.username }}！</h1>

        <!-- 资源显示 -->
        <div class="resources">
            <div class="resource-item">
                <div class="resource-label">抽卡券</div>
                <div class="resource-value">{{ user.tickets }}</div>
            </div>
            <div class="resource-item">
                <div class="resource-label">游戏币</div>
                <div class="resource-value">{{ user.coins }}</div>
            </div>
        </div>

        <!-- 保底进度 -->
        <div style="margin-top: 30px;">
            <h3>抽卡保底进度</h3>
            <div style="margin-top: 15px;">
                <p>SR保底：{{ user.sr_pity_count }} / 10</p>
                <div style="background: #eee; height: 20px; border-radius: 10px; overflow: hidden;">
                    <div style="background: #C77DD8; height: 100%; width: {{ (user.sr_pity_count / 10 * 100) }}%;"></div>
                </div>
            </div>
            <div style="margin-top: 15px;">
                <p>SSR保底：{{ user.ssr_pity_count }} / 90</p>
                <div style="background: #eee; height: 20px; border-radius: 10px; overflow: hidden;">
                    <div style="background: #FFD700; height: 100%; width: {{ (user.ssr_pity_count / 90 * 100) }}%;"></div>
                </div>
            </div>
        </div>

        <!-- 快捷入口 -->
        <div style="margin-top: 40px;">
            <h3>快捷入口</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
                <a href="{{ url_for('gacha.index') }}" class="btn" style="padding: 30px; text-align: center;">
                    🎲 立即抽卡
                </a>
                <a href="{{ url_for('cards.index') }}" class="btn btn-secondary" style="padding: 30px; text-align: center;">
                    🎴 查看卡牌
                </a>
                <a href="{{ url_for('battle.index') }}" class="btn btn-success" style="padding: 30px; text-align: center;">
                    ⚔️ 开始战斗
                </a>
                <a href="{{ url_for('cards.collection') }}" class="btn btn-secondary" style="padding: 30px; text-align: center;">
                    📚 卡牌图鉴
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

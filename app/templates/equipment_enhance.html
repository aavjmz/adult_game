{% extends "base.html" %}

{% block title %}装备强化 - 三国卡牌游戏{% endblock %}

{% block extra_css %}
<style>
    .enhance-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-top: 20px;
    }

    @media (max-width: 768px) {
        .enhance-container {
            grid-template-columns: 1fr;
        }
    }

    .equipment-select-panel {
        background: white;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .enhance-panel {
        background: white;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .equipment-list {
        max-height: 600px;
        overflow-y: auto;
    }

    .equipment-item {
        padding: 15px;
        margin-bottom: 10px;
        border: 2px solid #e5e7eb;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s;
    }

    .equipment-item:hover {
        border-color: #667eea;
        background: #f9fafb;
        transform: translateX(5px);
    }

    .equipment-item.selected {
        border-color: #667eea;
        background: linear-gradient(135deg, #eff6ff, #f9fafb);
    }

    .equipment-preview {
        text-align: center;
        padding: 30px;
        background: linear-gradient(135deg, #f9fafb, #ffffff);
        border-radius: 15px;
        margin-bottom: 20px;
    }

    .equipment-icon {
        font-size: 80px;
        margin-bottom: 15px;
    }

    .equipment-level-display {
        font-size: 32px;
        font-weight: bold;
        color: #667eea;
        margin: 20px 0;
    }

    .enhance-progress {
        margin: 20px 0;
    }

    .progress-bar {
        width: 100%;
        height: 30px;
        background: #e5e7eb;
        border-radius: 15px;
        overflow: hidden;
        position: relative;
    }

    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #667eea, #764ba2);
        transition: width 0.5s;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 14px;
    }

    .enhance-cost {
        background: #f3f4f6;
        padding: 20px;
        border-radius: 10px;
        margin: 20px 0;
    }

    .cost-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #e5e7eb;
    }

    .cost-item:last-child {
        border-bottom: none;
    }

    .cost-sufficient {
        color: #059669;
    }

    .cost-insufficient {
        color: #dc2626;
    }

    .enhance-button {
        width: 100%;
        padding: 18px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 20px;
    }

    .enhance-button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
    }

    .enhance-button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
    }

    .protection-option {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 15px;
        background: #fef3c7;
        border-radius: 10px;
        margin: 15px 0;
    }

    .protection-option input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
    }

    .protection-option label {
        cursor: pointer;
        flex: 1;
        font-weight: bold;
        color: #92400e;
    }

    .enhance-result-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 10000;
        align-items: center;
        justify-content: center;
    }

    .result-content {
        background: white;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        max-width: 400px;
        animation: bounceIn 0.5s;
    }

    @keyframes bounceIn {
        0% {
            transform: scale(0.3);
            opacity: 0;
        }
        50% {
            transform: scale(1.05);
        }
        100% {
            transform: scale(1);
            opacity: 1;
        }
    }

    .result-icon {
        font-size: 100px;
        margin-bottom: 20px;
    }

    .result-message {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .result-success {
        color: #059669;
    }

    .result-fail {
        color: #dc2626;
    }

    .result-protected {
        color: #f59e0b;
    }

    .result-details {
        padding: 20px;
        background: #f3f4f6;
        border-radius: 10px;
        margin: 20px 0;
    }

    .close-result-btn {
        padding: 12px 30px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .success-rate-display {
        text-align: center;
        padding: 15px;
        margin: 15px 0;
        background: linear-gradient(135deg, #dbeafe, #eff6ff);
        border-radius: 10px;
    }

    .success-rate-value {
        font-size: 36px;
        font-weight: bold;
        color: #1e40af;
    }

    .success-rate-label {
        color: #6b7280;
        margin-top: 5px;
    }

    .stats-comparison {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 15px;
        padding: 20px;
        background: #f9fafb;
        border-radius: 10px;
        margin: 20px 0;
        align-items: center;
    }

    .stat-before {
        text-align: right;
    }

    .stat-after {
        text-align: left;
    }

    .stat-arrow {
        font-size: 24px;
        color: #059669;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <!-- 返回按钮 -->
        <div style="margin-bottom: 20px;">
            <button onclick="window.location.href='/equipment/'" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 5px;">
                ← 返回装备仓库
            </button>
        </div>

        <h1>⚡ 装备强化</h1>
        <p style="color: #6b7280; margin-top: 5px;">提升装备等级，增强属性加成</p>

        <div class="enhance-container">
            <!-- 左侧：选择装备 -->
            <div class="equipment-select-panel">
                <h2>选择装备</h2>
                <div class="equipment-list" id="equipment-list">
                    <!-- 通过JavaScript加载 -->
                </div>
            </div>

            <!-- 右侧：强化面板 -->
            <div class="enhance-panel">
                <div id="no-selection" style="text-align: center; padding: 60px 20px; color: #9ca3af;">
                    <div style="font-size: 64px; margin-bottom: 20px;">⚔️</div>
                    <p>请从左侧选择一件装备进行强化</p>
                </div>

                <div id="enhance-ui" style="display: none;">
                    <!-- 装备预览 -->
                    <div class="equipment-preview">
                        <div class="equipment-icon" id="equip-icon">⚔️</div>
                        <div id="equip-name" style="font-size: 24px; font-weight: bold; color: #333;">-</div>
                        <div id="equip-quality" style="color: #6b7280; margin-top: 5px;">-</div>
                        <div class="equipment-level-display">
                            <span id="current-level">+0</span>
                            <span style="color: #9ca3af;"> → </span>
                            <span id="next-level" style="color: #059669;">+1</span>
                        </div>
                    </div>

                    <!-- 成功率 -->
                    <div class="success-rate-display">
                        <div class="success-rate-value" id="success-rate">100%</div>
                        <div class="success-rate-label">强化成功率</div>
                    </div>

                    <!-- 属性对比 -->
                    <div id="stats-comparison"></div>

                    <!-- 强化消耗 -->
                    <div class="enhance-cost">
                        <h3 style="margin-bottom: 15px;">💎 强化消耗</h3>
                        <div class="cost-item">
                            <span>强化石</span>
                            <span id="cost-stones" class="cost-sufficient">0</span>
                        </div>
                        <div class="cost-item">
                            <span>金币</span>
                            <span id="cost-coins" class="cost-sufficient">0</span>
                        </div>
                    </div>

                    <!-- 保护符选项 -->
                    <div class="protection-option">
                        <input type="checkbox" id="use-protection" />
                        <label for="use-protection">
                            🛡️ 使用保护符（失败时防止装备降级）
                        </label>
                    </div>

                    <!-- 强化按钮 -->
                    <button class="enhance-button" id="enhance-btn" onclick="performEnhance()">
                        ⚡ 开始强化
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 强化结果弹窗 -->
<div id="result-modal" class="enhance-result-modal">
    <div class="result-content">
        <div class="result-icon" id="result-icon">✨</div>
        <div class="result-message" id="result-message">强化中...</div>
        <div class="result-details" id="result-details"></div>
        <button class="close-result-btn" onclick="closeResultModal()">确定</button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let equipments = [];
let selectedEquipment = null;

document.addEventListener('DOMContentLoaded', function() {
    loadEquipments();
    loadURLParams();
});

// 从URL加载参数
function loadURLParams() {
    const urlParams = new URLSearchParams(window.location.search);
    const equipId = urlParams.get('id');
    if (equipId) {
        // 等待装备加载后自动选择
        setTimeout(() => {
            const equip = equipments.find(e => e.id == equipId);
            if (equip) {
                selectEquipment(equip);
            }
        }, 500);
    }
}

// 加载装备列表
async function loadEquipments() {
    try {
        const response = await fetch('/equipment/list?unequipped=false');
        const data = await response.json();

        if (data.success) {
            equipments = data.equipments;
            renderEquipmentList();
        }
    } catch (error) {
        console.error('加载装备失败:', error);
        alert('加载装备失败');
    }
}

// 渲染装备列表
function renderEquipmentList() {
    const list = document.getElementById('equipment-list');
    list.innerHTML = '';

    if (equipments.length === 0) {
        list.innerHTML = '<p style="text-align: center; color: #9ca3af; padding: 20px;">暂无装备</p>';
        return;
    }

    equipments.forEach(equip => {
        const item = document.createElement('div');
        item.className = 'equipment-item';
        item.onclick = () => selectEquipment(equip);

        item.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-weight: bold;">${equip.name}</div>
                    <div style="font-size: 12px; color: #6b7280; margin-top: 5px;">
                        ${getQualityText(equip.quality)} | +${equip.enhance_level}
                    </div>
                </div>
                <div style="font-size: 24px;">${getTypeIcon(equip.type)}</div>
            </div>
        `;

        list.appendChild(item);
    });
}

// 选择装备
function selectEquipment(equip) {
    selectedEquipment = equip;

    // 更新UI
    document.querySelectorAll('.equipment-item').forEach(item => {
        item.classList.remove('selected');
    });
    event?.currentTarget?.classList.add('selected');

    // 显示强化面板
    document.getElementById('no-selection').style.display = 'none';
    document.getElementById('enhance-ui').style.display = 'block';

    // 更新装备信息
    document.getElementById('equip-icon').textContent = getTypeIcon(equip.type);
    document.getElementById('equip-name').textContent = equip.name;
    document.getElementById('equip-quality').textContent = `${getQualityText(equip.quality)} | 战力 ${equip.power}`;
    document.getElementById('current-level').textContent = `+${equip.enhance_level}`;
    document.getElementById('next-level').textContent = `+${equip.enhance_level + 1}`;

    // 计算成功率
    const successRate = calculateSuccessRate(equip.enhance_level);
    document.getElementById('success-rate').textContent = `${(successRate * 100).toFixed(0)}%`;

    // 计算消耗
    const cost = calculateCost(equip.enhance_level, equip.quality);
    document.getElementById('cost-stones').textContent = `${cost.stones} / 拥有: 999`;
    document.getElementById('cost-coins').textContent = `${cost.coins} / 拥有: 1,000,000`;

    // 显示属性对比
    renderStatsComparison(equip);
}

// 渲染属性对比
function renderStatsComparison(equip) {
    const container = document.getElementById('stats-comparison');
    const currentMultiplier = 1 + (equip.enhance_level * 0.05);
    const nextMultiplier = 1 + ((equip.enhance_level + 1) * 0.05);

    let html = '<h3 style="grid-column: 1 / -1; margin-bottom: 10px;">📊 属性变化</h3>';

    if (equip.bonus) {
        for (const [key, value] of Object.entries(equip.bonus)) {
            if (value > 0 && !key.includes('random')) {
                const baseValue = value / currentMultiplier;
                const currentValue = baseValue * currentMultiplier;
                const nextValue = baseValue * nextMultiplier;

                const currentDisplay = key.includes('pct') ?
                    `${(currentValue * 100).toFixed(1)}%` : currentValue.toFixed(0);
                const nextDisplay = key.includes('pct') ?
                    `${(nextValue * 100).toFixed(1)}%` : nextValue.toFixed(0);

                html += `
                    <div class="stat-before">${currentDisplay}</div>
                    <div class="stat-arrow">→</div>
                    <div class="stat-after" style="color: #059669; font-weight: bold;">${nextDisplay}</div>
                `;
            }
        }
    }

    container.innerHTML = html;
}

// 执行强化
async function performEnhance() {
    if (!selectedEquipment) {
        alert('请先选择装备');
        return;
    }

    const useProtection = document.getElementById('use-protection').checked;

    // 禁用按钮
    const btn = document.getElementById('enhance-btn');
    btn.disabled = true;
    btn.textContent = '强化中...';

    try {
        const response = await fetch('/equipment/enhance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                equipment_id: selectedEquipment.id,
                use_protection: useProtection
            })
        });

        const data = await response.json();

        if (data.success) {
            showEnhanceResult(data);
            // 刷新装备列表
            setTimeout(() => {
                loadEquipments();
                selectedEquipment = null;
                document.getElementById('no-selection').style.display = 'block';
                document.getElementById('enhance-ui').style.display = 'none';
            }, 3000);
        } else {
            alert(data.error || '强化失败');
        }
    } catch (error) {
        console.error('强化失败:', error);
        alert('强化失败，请重试');
    } finally {
        btn.disabled = false;
        btn.textContent = '⚡ 开始强化';
    }
}

// 显示强化结果
function showEnhanceResult(data) {
    const modal = document.getElementById('result-modal');
    const icon = document.getElementById('result-icon');
    const message = document.getElementById('result-message');
    const details = document.getElementById('result-details');

    if (data.result === 'success') {
        icon.textContent = '✨';
        message.textContent = '强化成功！';
        message.className = 'result-message result-success';
        details.innerHTML = `
            <div style="font-size: 32px; font-weight: bold; color: #059669;">
                +${data.old_level} → +${data.new_level}
            </div>
            <div style="margin-top: 10px; color: #6b7280;">
                战力提升至 ${data.power}
            </div>
        `;
    } else if (data.result === 'fail_protected') {
        icon.textContent = '🛡️';
        message.textContent = '强化失败，但保护符生效！';
        message.className = 'result-message result-protected';
        details.innerHTML = `
            <div style="color: #6b7280;">
                装备等级未降低，仍为 +${data.new_level}
            </div>
        `;
    } else {
        icon.textContent = '💔';
        message.textContent = '强化失败！';
        message.className = 'result-message result-fail';
        details.innerHTML = `
            <div style="font-size: 32px; font-weight: bold; color: #dc2626;">
                +${data.old_level} → +${data.new_level}
            </div>
            <div style="margin-top: 10px; color: #6b7280;">
                降低了 ${data.penalty} 级
            </div>
        `;
    }

    modal.style.display = 'flex';
}

// 关闭结果弹窗
function closeResultModal() {
    document.getElementById('result-modal').style.display = 'none';
}

// 计算成功率
function calculateSuccessRate(level) {
    if (level < 6) return 1.0;
    if (level < 11) return 0.9;
    if (level < 16) return 0.7;
    if (level < 21) return 0.5;
    if (level < 26) return 0.3;
    return 0.1;
}

// 计算消耗
function calculateCost(level, quality) {
    const qualityMultipliers = {
        'common': 1,
        'rare': 2,
        'epic': 5,
        'legendary': 10,
        'mythic': 20
    };

    const multiplier = qualityMultipliers[quality] || 1;
    const stones = (5 + level) * multiplier;
    const coins = (10000 + level * 10000) * multiplier;

    return { stones, coins };
}

function getQualityText(quality) {
    const map = {
        'mythic': '神话',
        'legendary': '传说',
        'epic': '史诗',
        'rare': '稀有',
        'common': '普通'
    };
    return map[quality] || quality;
}

function getTypeIcon(type) {
    const map = {
        'weapon': '⚔️',
        'armor': '🛡️',
        'accessory': '💍',
        'treasure': '📜'
    };
    return map[type] || '📦';
}
</script>
{% endblock %}
